tp://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-14/676f41c36e40e0718579bfbb25e4f2df.jpg",5,59843348,"本书精心收录了林徽因先生近乎所有独立创作的建筑文稿，总计14篇。以1932年至1955年为时间轴，既详实记录了中国建筑的特征与发展历程，又充分展现了林徽因先生对中国建筑的观点与评价。在《平郊建筑杂录》中，流露出对动荡时代古建筑难以保存的惋惜之情；在《现代住宅设计的参考》里，表达了对现代住宅的殷切期待；于《中国建筑彩画图案》序文中，则呈现出对中国建筑彩画的深入考证与由衷赞叹。本书既有学术的严谨性，又有描写的生动性，诗意的语言使广大读者能够更加直观地感受中国建筑的独特魅力。此外，书中还配有30余幅重新绘制的手绘图。因原文图纸精度欠佳故进行重绘，涵盖屋顶、斗拱、平面布局等内容。图文结合的呈现方式，让读者能够更加简便、直观地理解中国建筑的特色。",18,3990,"2025-01-01 00:00:00","江苏凤凰科学技术出版社","林徽因谈中国建筑",150598,{"aliasName":39,"author":92,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":93,"brand":74,"categories":94,"cbid":98,"centerADid":6,"centerAuthorId":99,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":100,"discount":6,"epubAllMaxFreeChapter":101,"finished":31,"form":32,"free":12,"hasEpub":31,"id":102,"intro":103,"isTxt":5,"lastChapter":104,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":105,"publishTime":106,"publisher":88,"rate":39,"sexAttr":40,"tags":9,"title":107,"totalChapters":104,"totalWords":108,"translator":9,"type":12},"李凤禹 李文玺 周春鹏","2026-07-22 10:28:37",[95,96,97],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36261740107865410,"36464325604536301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/31e475abed70517ce6f7753941422af1.jpg",8,59843408,"本书通过记录始建于明永乐年间的文明桥的修复更新，阐述了在经济发展放缓，土地财政面临严峻挑战的特殊时期，如何通过“企业捐赠+国资投入+全民参与”的社会参与模式，对具有较高历史价值的城市空间节点进行修复更新，使其焕发新生。书中对文明桥以艺术导向的美学设计去塑造核心IP，重新彰显文明桥的历史光彩，激励人文精神，焕新水乡文化基因和创新精神堡垒。本书分为六大部分，分别对文明桥的历史渊源、顶层设计、具体方案、技术解构、国际声誉、社会影响及未来畅享进行阐述，为当下经济发展放缓大背景下的城市更新提供了新的模式和思路，为各地城市管理、设计、运营人员提供了有益的参考。",48,7900,"2025-09-01 00:00:00","枕水文明：六百年古桥焕新记",92287,{"aliasName":39,"author":110,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":111,"brand":74,"categories":112,"cbid":116,"centerADid":6,"centerAuthorId":117,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover" 2026-07-22/dd1407a2c79f4416051bfdd00072f3ce.jpg",59843557,"本书是夏昌世教授多年来艺海拾贝，累积成篇，作为岭南新建筑拓荒者的思想及创作的珍贵资料，亦是我国园林研究的重要成果。夏教授对中国古典园林的研究不只囿于怀古，而是吸收丰富素材，孕生现代建筑创作新风格。全书分为八篇，其中专设“南北造园风格及其特点”章节。早在20世纪30年代，作者就曾与梁思成、刘敦祯、卢奉璋先生一起，考察江南一带的私家园林，50—60年代又做了深入的调查研究。因此，此章论述具有相当的权威性和启发性，它传承、发扬和发展了以《园冶》和计成、李渔等为代表的中国古典园林学理论和实践的精华。夏昌世教授于1995年出版的《园林述要》一书，被业界堪称为《园冶》的“现代版续编”。本书在《园林述要》的基础上重新整理，传承、发扬和发展了以《园冶》和计成、李渔等为代表的中国古典园林学理论和实践的精华。",14,"2025-06-01 00:00:00","古典园林述要",70936,{"aliasName":39,"author":144,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":145,"brand":9,"categories":146,"cbid":150,"centerADid":6,"centerAuthorId":151,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":152,"discount":6,"epubAllMaxFreeChapter":153,"finished":31,"form":32,"free":12,"hasEpub":31,"id":154,"intro":155,"isTxt":5,"lastChapter":156,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":157,"publishTime":158,"publisher":159,"rate":39,"sexAttr":40,"tags":9,"title":160,"totalChapters":156,"totalWords":161,"translator":9,"type":12},"周彝馨等","2026-06-05 21:42:45",[147,148,149],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},35794920703428304,"36059081207059401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-06-05/79697a6136272e527278de3f5d65441a.jpg",13,59114857,"岭南祠、庙建筑不仅形制同构，而且都是岭南建筑的精华代表，全面、清晰地保存了岭南建筑的特色和演变历史。本书介绍了岭南祠庙中的19个代表作品，从环境、总体型制、单体型制、结构型制、装饰型制几个方面阐述了岭南祠庙建筑型制，并深刻解读了岭南祠庙建筑宗族集权、因地制宜、慎终追远、开放多元、彰显富贵等人文特点。全书图文并茂，并有精美手绘插画和测绘图，呈现出精彩纷呈的岭南祠庙艺术形象。本书可供建筑设计人员、建筑研究人员及相关专业人员参考，也可作为科普书籍供对岭南建筑有兴趣的读者阅读。",72,3919,"2023-01-01 00:00:00","化学工业出版社","岭南祠庙一阕",70300,{"aliasName":39,"author":163,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":164,"brand":9,"categories":165,"cbid":169,"centerADid":6,"centerAuthorId":170,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":171,"discount":6,"epubAllMaxFreeChapter":172,"finished":31,"form":32,"free":12,"hasEpub":31,"id":173,"intro":174,"isTxt":5,"lastChapter":175,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":176,"publishTime":177,"publisher":178,"rate":39,"sexAttr":40,"tags":9,"title":179,"totalChapters":175,"totalWords":180,"translator":9,"type":12},"连达","2026-08-31 11:36:13",[166,167,168],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36747114904193500,"10080942104693901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-08-31/415b7694f3ecef01dc39042a8741de4f.jpg",9,60622401,"本书为《看懂古建筑》精华版，从古建筑的分类和各部位、构件要素的演变进行梳理和讲述，并以各地的现存古建筑实例来说明古建筑在历史上的发展演变。全书完整保留原作知识体系与核心精华内容，优化篇幅与开本设计，将古建筑解构进行解剖，为读者构建起一系列在中国建筑史上具有重要地位的古建筑框架。",52,3540,"2026-07-01 00:00:00","电子工业出版社","看懂古建筑（精华版）",81703,{"aliasName":39,"author":182,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":183,"brand":184,"categories":185,"cbid":189,"centerADid":6,"centerAuthorId":190,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":191,"discount":6,"epubAllMaxFreeChapter":6,"finished":31,"form":32,"free":12,"hasEpub":5,"id":192,"intro":193,"isTxt":31,"lastChapter":139,"lastChapterName":194,"maxfreechapter":12,"oversea":6,"price":195,"publishTime":196,"publisher":197,"rate":39,"sexAttr":40,"tags":9,"title":198,"totalChapters":139,"totalWords":199,"translator":200,"type":12},"(英)迪耶·萨迪奇","2026-06-29 11:30:22","华章同人",[186,187,188],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36210294607896104,"9501032203455301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-06-26/836bc7e927099f61fe39046ac6f835b0.JPEG",59761780,"建筑不只是简单的人类寄居之所，它也记录了人类社会的发展变革。人们习惯于从文化和艺术角度来审视建筑，却很少追问“建筑为什么存在”。英国知名建筑评论家迪耶·萨迪奇通过讲述帝国总理府、总统图书馆、水晶大教堂、世贸双子塔等知名建筑背后的故事，揭示了建筑的隐形语言——人们对权力的长久崇拜以及权贵通过建筑表达的无尽欲望。萨迪奇援引历史、地理、哲学、心理学、社会学等证据，雄辩地证明了建筑首先是权力的象征，然后才是美的表达。","第14章 注释",4080,"2022-05-01 00:00:00","重庆出版社","权力与建筑",213816,"吴真贞",{"aliasName":39,"author":202,"authorAvata p://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/679c94e083b92511bb6c20631537e50e.jpg",59843663,"本书分为五章：第一章“中国古典园林艺术”，简单介绍了中国古典园林的内涵与要素、审美体验、艺术境界和造园“意匠”等；第二章到第四章“园林动物景观营造”“园林诗画景观营造”“园林天象景观营造”，分别从动物景观、诗画景观、天象景观的角度入手，讲解了三类景观的营造对园林的作和以及营造技法，并提供了若干园林案例；第五章“园林雅俗活动开展”从园居生活与园林活动入手，解析古人在园林中开展的各项雅俗活动，点明了园林的营造是为了服务人的生活。本书在前作《图解中国园林》的基础上，以中国古典园林八大要素中的四项升华要素为对象进行阐述，介绍了丰富的园林知识，尽可能融知识性与趣味性于一体，做到轻松有趣、通俗易懂、图文并茂。希望本书能为读者了解中国古典园林的营造与园居生活的趣味提供参考，让读者体会中国园林的魅力。",58,3400,"2025-05-01 00:00:00","图解中国园林2",50612,[237,253,269,285,301,317],{"author":238,"authorId":6,"categories":239,"centerADid":6,"centerAuthorId":243,"chapterUpdatetime":9,"cover":244,"discount":6,"extra":245,"finished":31,"free":12,"hasEpub":31,"id":247,"intro":248,"isTxt":5,"lastChapter":249,"lastChapterName":9,"price":250,"score":6,"sexAttr":40,"title":251,"totalChapters":249,"totalWords":252,"type":12},"(法)勒·柯布西耶",[240,241,242],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"15064844705299301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-09-01/0b83821683330e9ccc7f61ab81b15936.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":246},"34372",24906250,"“20世纪20年代初，石头缝里迸出了一个孙猴子，柯布西耶出版了《走向新建筑》，造了玉皇大帝的反。”《走向新建筑》被称为“一本奇书”、“一本极重要的书”、“一本永远不会磨灭的书”，“它把几千年来的建筑价值观颠倒过来了”。几千年的建筑史无非是帝王将相宫殿庙宇的历史……他关心为普通而平常的人使用的普通而平常的住宅，将其当作建筑学的基本层次，而任凭宫殿倒塌。他关心人的尺度，强调恢复人道的基础，需要的标准、功能的标准、情感的标准，认为这就是一切。他提出了建筑必须走平民化、工业化、功能化道路，反对搞虚假装饰的古典主义；提出“住宅是住人的机器”这句划时代的名言，并建立了现代建筑的美学观念“工程师美学”。他的彻底性和坚定性，他的石破天惊的理论和观念，对世界现代建筑的形成和发展产生了重大而深刻的影响。",55,2900,"走向新建筑",70791,{"author":254,"authorId":6,"categories":255,"centerADid":6,"centerAuthorId":259,"chapterUpdatetime":9,"cover":260,"discount":6,"extra":261,"finished":31,"free":12,"hasEpub":31,"id":263,"intro":264,"isTxt":5,"lastChapter":265,"lastChapterName":9,"price":266,"score":6,"sexAttr":40,"title":267,"totalChapters":265,"totalWords":268,"type":12},"谢景",[256,257,258],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"26954893802865101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2023-07-17/8377869dc3b77d6176381b2cd7ae1757.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":262},"29798",47216119,"庭院、斗拱和藻井作为中国古建筑的三大重要元素，其源远流长。学术界对于它们的探讨一直以来没有停息过。建筑实践更是受到了这些中国元素的影响，特别是在重要公共文化建筑中，它们一直被创新性地诠释。但是，目前绝大多数的学术研究对于这些建筑元素都是围绕在其类型学和结构功能方面的，在人文上的研究甚少。或许正是因为缺少人文上的基础研究，导致了现代建筑实践中把庭院、斗拱和藻井仅仅作为一种空间、结构和视觉元素。本书追溯庭院、斗拱和藻井在早期中国的渊源，以及它们在汉代一系列与天国和升天主题相关的演绎。本研究的基础材料主要为考古发现的新石器时代遗址，商周青铜器和宫殿庙宇遗址，汉代石墓、画像石和铜镜等，以及古文字和文献资料。通过研究可以看到庭院、斗拱和藻井在早期有效地表达了中国古人的宇宙观、世界观和人生观。",45,4060,"中国建筑要素溯源：庭院、斗拱和藻井",68056,{"author":270,"authorId":6,"categories":271,"centerADid":6,"centerAuthorId":275,"chapterUpdatetime":9,"cover":276,"discount":6,"extra":277,"finished":31,"free":12,"hasEpub":5,"id":279,"intro":280,"isTxt":31,"lastChapter":172,"lastChapterName":281,"price":282,"score":6,"sexAttr":40,"title":283,"totalChapters":172,"totalWords":284,"type":12},"陈璞编著",[272,273,274],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"18642226901200601","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-06-08/517b1a43827dc2f84085795f7d9d6784.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":278},"38796",35038350,"中华文化曾是东方文化的摇篮，也是推动整个世界始终发展的动力。早在500年前，中华文化催生了欧洲文艺复兴运动和地理大发现。在200年前，中华文化推动了欧洲启蒙运动和现代思想。中国四大发明先后传到西方，对于促进西方工业社会发展和形成，曾起到了重要作用。中国文化最具博大性和包容性，所以世界各国都已经掀起中国文化热。中华文化的力量，已经深深熔铸到我们的生命力、创造力和凝聚力中，是我们民族的基因。中华民族的精神，也已深深植根于绵延数千年的优秀文化传统之中，是我们的精神家园。但是，当我们为中华文化而自豪时，也要正视其在近代衰微的历史。相对于五千年的灿烂文化来说，这仅仅是短暂的低潮，是喷薄前的力量积聚。","第9章 白带山麓的云居寺",699,"御赐的古寺",41112,{"author":286,"authorId":6,"categories":287,"centerADid":6,"centerAuthorId":291,"chapterUpdatetime":9,"cover":292,"discount":6,"extra":293,"finished":31,"free":12,"hasEpub":31,"id":295,"intro":296,"isTxt":5,"lastChapter":297,"lastChapterName":9,"price":298,"score":6,"sexAttr":40,"title":299,"totalChapters":297,"totalWords":300,"type" apterUpdatetime":9,"cover":367,"discount":6,"extra":368,"finished":31,"free":12,"hasEpub":5,"id":370,"intro":371,"isTxt":31,"lastChapter":47,"lastChapterName":372,"price":373,"score":6,"sexAttr":40,"title":374,"totalChapters":47,"totalWords":375,"type":12},"知夏",[363,364,365],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"9501000203789401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2025-08-28/d50ad7f430bc84e7416a65be78556d30.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":369},"57498",56120361,"一砖一瓦，镌刻历史兴衰；一榫一卯，暗藏天地乾坤。从宫殿庙宇到亭台楼阁，揭开每一处飞檐斗拱背后的传奇。从辽东到甘南，从蒙北到西川……二十年间，作者曾跋山涉水，走过许多地方，寻访古建筑，投身于当地历史乃至风士人情当中。有些古建筑闻名遐迩，但更多的是人迹罕至、鲜为人知。有时在僻远村隅，人烟稀少，能攀谈的也只有全国重点文物保护单位的守门人……除了将古建知识和背后故事娓娓道来、用相机记录下古建的旧貌新颜外，作者还写了一些读诗读书经历。许多诗中之意、书中之理本不理解，在一次次远行中，偶有感悟乍现，便更不虚此行。","第46章 后记",2990,"穿越千年看古建",165790,{"author":377,"authorId":6,"categories":378,"centerADid":6,"centerAuthorId":382,"chapterUpdatetime":9,"cover":383,"discount":6,"extra":384,"finished":31,"free":12,"hasEpub":5,"id":386,"intro":387,"isTxt":31,"lastChapter":388,"lastChapterName":389,"price":390,"score":6,"sexAttr":40,"title":391,"totalChapters":388,"totalWords":392,"type":12},"陆明",[379,380,381],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"4697534804439601","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2019-06-13/2abac7e72aa25c58c1b9ca94f4b35d13.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":385},"41928",25553763,"很早之前有这样一个想法，用那些为世人瞩目的中华经典背后的故事与传奇，让国人来了解中华的历史、解析中华的文化。其实，无论是书法国画、奇珍异宝、园林建筑，都在其特定的历史跨度中，有其不同寻常的内涵。这个了解、解析的过程，暂且让我们将它命名为——“另类考古”。“另类考古”的过程是浪漫和神秘的，也一定是趣味盎然的。因为世上还没有哪一门学科能像它这般漫长的诡譎、突兀的辉煌与瞠目的神奇。况且，历史老人往往更愿意让自己的哑谜被人不经意地揭穿。这样一来，每一个经典背后的故事在布满谜思的同时，每每出人意外，又深深地吸引着每一个人的眼球。当然，“另类考古”不是完整意义上的“考古的历史”或是“历史的考古”，但它所讲述的故事无不与历史的前进与人类的进步和创造力有关，所以它的内容注定是充满挑战和令人耳目一新的。进入历史文化的深处，了解文化背后的传奇，是此书的最终目的。史实与传奇合二而一，厚重与灵异经纬交错，诱惑你的阅读，牵引你的想象。告别枯燥繁杂的专业考试，走入丰富多彩的考古之旅。第三只眼看历史，发掘湮没已久的惊人真相。带你进入一个波澜壮阔的古代文明世界，为你揭开一个个千百年来困扰世人的历史谜团。",31,"第31章 慈禧墓之劫",899,"建筑背后的故事",112757,{"author":394,"authorId":6,"categories":395,"centerADid":6,"centerAuthorId":399,"chapterUpdatetime":9,"cover":400,"discount":6,"extra":401,"finished":31,"free":12,"hasEpub":31,"id":403,"intro":404,"isTxt":5,"lastChapter":405,"lastChapterName":9,"price":406,"score":6,"sexAttr":40,"title":407,"totalChapters":405,"totalWords":408,"type":12},"周丽霞 肖东发",[396,397,398],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"13412777503769601","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-01-03/1bfb1627eb64d9272de57e8ed7436ee9.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":402},"32044",25064438,"总之，中国文化博大精深，是中华各族人民五千年来创造、传承下来的物质文明和精神文明的总和，其内容包罗万象，浩若星汉，具有很强文化纵深，蕴 含丰富宝藏。我们要实现中华文化伟大复兴，首先要站在传统文化前沿，薪火相传，一脉相承，弘扬和发展五千年来很好的、光明的、最最的、科学的、 文明的和自豪的文化现象，融合古今中外一切文化精华，构建具有中国特色的现代民族文化，向世界和未来展示中华民族的文化力量、文化价值、文化形 态与文化风采。为此，在有关专家指导下，我们收集整理了大量古今资料和最新研究成果，特别编撰了本套大型书系。主要包括独具特色的语言文字、浩 如烟海的文化典籍、名扬世界的科技工艺、异彩纷呈的文学艺术、充满智慧的中国哲学、完备而深刻的伦理道德、古风古韵的建筑遗存、深具内涵的自然 名胜、悠久传承的历史文明，还有各具特色又相互交融的地域文化和民族文化等，充分显示了中华民族厚重文化底蕴和强大民族凝聚力，具有极强系统性 、广博性和规模性。本套书系的特点是全景展现，纵横捭阖，内容采取讲故事的方式进行叙述，语言通俗，明白晓畅，图文并茂，形象直观，古风古韵， 格调高雅，具有很强的可读性、欣赏性、知识性和延伸性，能够让广大读者全面触摸和感受中国文化的丰富内涵，增强中华儿女民族自尊心和文化自豪感 ，并能很好继承和弘扬中国文化，创造未来中国特色的最最民族文化。",29,999,"壮丽皇宫：三大故宫的建筑壮景",73891,{"author":410,"authorId":6,"categories":411,"centerADid":6,"centerAuthorId":415,"chapterUpdatetime":9,"cover":416,"discount":6,"extra":417,"finished":31,"free":12,"hasEpub":5,"id":419,"intro":420,"isTxt":31,"lastChapter":421,"lastChapterName":422,"price":423,"score":6,"sexAttr":40,"title":424,"totalChapters":421,"totalWords":425,"type":12},"罗照田",[412,413,414],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"21958400301617101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-12-06/b7110fb5eacd960552ba71e376e054c6.JPEG",{"favcount":39,"allwo
