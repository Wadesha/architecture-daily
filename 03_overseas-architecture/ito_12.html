},[51],{"aliasName":39,"author":10,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":52,"brand":53,"categories":54,"cbid":58,"centerADid":6,"centerAuthorId":27,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":59,"discount":6,"epubAllMaxFreeChapter":60,"finished":31,"form":32,"free":12,"hasEpub":31,"id":61,"intro":62,"isTxt":5,"lastChapter":63,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":64,"publishTime":65,"publisher":66,"rate":39,"sexAttr":40,"tags":9,"title":67,"totalChapters":63,"totalWords":68,"translator":69,"type":12},"2020-11-28 22:34:10","清华大学",[55,56,57],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},15367252005339306,"http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-11-28/582daa590f59d48bef71ea1e40255fcc.jpg",16,26943902,"这是作者于1944年出版的、旨在让日本国民了解本国建筑，进而产生民族自豪感的小书《日本建筑的真相》（日本建築の実相）。该书深入浅出，从日本建筑特色的产生原因入手，简明扼要地讲述了日本古建筑史，阐明了日本传统建筑的特性，日本建筑在世界建筑史的地位分析，以及日本建筑应何去何从。为便于读者理解，编辑和译者在书中插入了作者另一本专著《日本建筑研究》（日本建築の研究）的部分文字和图片，取名为《日本建筑小史》。时隔七十多年，其中的很多观点对现在的我们仍有借鉴和启发。",56,3430,"2017-03-01 00:00:00","清华大学出版社","日本建筑小史",80730,"杨田",[71,91,109,130,148,165,184,203,222],{"aliasName":39,"author":72,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":73,"brand":74,"categories":75,"cbid":79,"centerADid":6,"centerAuthorId":80,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":81,"discount":6,"epubAllMaxFreeChapter":82,"finished":31,"form":32,"free":12,"hasEpub":31,"id":83,"intro":84,"isTxt":5,"lastChapter":85,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":86,"publishTime":87,"publisher":88,"rate":39,"sexAttr":40,"tags":9,"title":89,"totalChapters":85,"totalWords":90,"translator":9,"type":12},"林徽因著 高钰琛 郑文霞编","2026-07-14 15:32:21","凤凰空间",[76,77,78],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262487507296010,"36397050804780901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-14/676f41c36e40e0718579bfbb25e4f2df.jpg",5,59843348,"本书精心收录了林徽因先生近乎所有独立创作的建筑文稿，总计14篇。以1932年至1955年为时间轴，既详实记录了中国建筑的特征与发展历程，又充分展现了林徽因先生对中国建筑的观点与评价。在《平郊建筑杂录》中，流露出对动荡时代古建筑难以保存的惋惜之情；在《现代住宅设计的参考》里，表达了对现代住宅的殷切期待；于《中国建筑彩画图案》序文中，则呈现出对中国建筑彩画的深入考证与由衷赞叹。本书既有学术的严谨性，又有描写的生动性，诗意的语言使广大读者能够更加直观地感受中国建筑的独特魅力。此外，书中还配有30余幅重新绘制的手绘图。因原文图纸精度欠佳故进行重绘，涵盖屋顶、斗拱、平面布局等内容。图文结合的呈现方式，让读者能够更加简便、直观地理解中国建筑的特色。",18,3990,"2025-01-01 00:00:00","江苏凤凰科学技术出版社","林徽因谈中国建筑",150598,{"aliasName":39,"author":92,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":93,"brand":74,"categories":94,"cbid":98,"centerADid":6,"centerAuthorId":99,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":100,"discount":6,"epubAllMaxFreeChapter":101,"finished":31,"form":32,"free":12,"hasEpub":31,"id":102,"intro":103,"isTxt":5,"lastChapter":104,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":105,"publishTime":106,"publisher":88,"rate":39,"sexAttr":40,"tags":9,"title":107,"totalChapters":104,"totalWords":108,"translator":9,"type":12},"梁思成著 向艳丽编","2026-07-22 11:44:40",[95,96,97],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262527303486504,"36464396904591401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/b357349e76a7fc43ee8f7bd7b5bb31b5.jpg",6,59843669,"中国建筑是延续了两千余年的工程技术，是中国文化的具体表现，是中华民族艺术的大宗遗产。《梁思成讲古建精编插图版》以梁思成先生相关著作为底本，精心编撰，对古建做通识性介绍。本书分为三大章节。第一章为古建基础，介绍中国古建的基本常识。第二章为古建风姿，讲解不同种类的建筑艺术，如佛教建筑、宫殿建筑、石窟造像、民居、桥梁、陵墓建筑等。第三章为古建闲谈，精选可读性较强，能体现梁思成先生哲思的建筑小品文。书中插图多梁思成先生的手绘原稿，图文互现，读者既可领略古建之美，也能领会其高超的绘图技术和严谨的学风。本书既可以作为建筑研究者的学习参考书，亦可成为普通古建爱好者的入门读物。",26,3490,"2026-01-01 00:00:00","梁思成讲古建（精编插图版）",73798,{"aliasName":39,"author":110,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":111,"brand":112,"categories":113,"cbid":117,"centerADid":6,"centerAuthorId":118,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":119,"discount":6,"epubAllMaxFreeChapter":6,"finished":31,"form":32,"free":12,"hasEpub":5,"id":120,"intro":121,"isTxt":31,"lastChapter":122,"lastChapterName":123,"maxfreechapter":12,"oversea":6,"price":124,"publishTime":125,"publisher":126,"rate":39,"sexAttr":40,"tags":9,"title":127,"totalChapters":122,"totalWords":128,"translator":129,"type":12},"(英)迪耶·萨迪奇","2026-06-29 11:30:22","华章同人",[114,115,116],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36210294607896104,"9501032203455301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-06-26/836bc7e927099f61fe39046ac6f835b0.JPEG",59761780,"建筑不只是简单的人类寄居之所，它也记录了人类社会的发展变革。人们习惯于从文化和艺术角度来审视建筑，却很少追问“建筑为什么存在”。英国知名建筑评论家迪耶·萨迪奇通过讲述帝国总理府、总统图书馆、水晶大教堂、世贸双子塔等知名建筑背后的故事，揭示了建筑的隐形语言——人们对权力的长久崇拜以及权贵通过建筑表达的无尽欲望。萨迪奇援引历史、地理、哲学、心理学、社会学等证据，雄辩地证明了建筑首先是权力的象征，然后才是美的表达。",14,"第14章 注释",4080,"2022-05-01 00:00:00","重庆出版社","权力与建筑",213816,"吴真贞",{"aliasName":39,"author":131,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":132,"brand":74,"categories":133,"cbid":137,"centerADid":6,"centerAuthorId":138,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":139,"discount":6,"epubAllMaxFreeChapter":82,"finished":31,"form":32,"free":12,"hasEpub":31,"id":140,"intro":141,"isTxt":5,"lastChapter":142,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":143,"publishTime":144,"publisher":145,"rate":39,"sexAttr":40,"tags":9,"title":146,"totalChapters":142,"totalWords":147,"translator":9,"type":12},"张一梦","2026-07-22 11:23:28",[134,135,136],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262277404432700,"32432358307208101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/b8c4705195c88aae1d1d06c8d1e24999.jpg",59843414,"郭熙提出中国画“可游”和“可居”画论，本书中对应地以“游”与“居”两大部分展开。每一部分又同时涉及山水画和城市画两种题材，对应建筑学视野中对建筑、景观和城市统一的思考。第’二、三章从宏观的视角审视中国画，主要通过分析长卷这种绘画媒材，探讨中国画“游”中的时间意识。第’二章“山水画卷：咫尺千里的自然远意”与第三章“城市全景：一图百态的市井意向”分别对应着山水与城市题材的画作。通过解读山水、城市题材的长卷画、地图画，分析三远法、以大观小法等时空建构图式，读者将在全景漫游中了解古代人居环境构建的时间意识、自然观以及城市规划意向。第四章“山水屋宇：栖居自然的文人理想”与第’五章“城市建筑：内外之间的空间中介”是对第’二、三章出现过的画作的进一步分析，将视角从宏观放大至微观，聚焦画中的人居场所，探讨中国画“居”的空间意识。这两章主要关注山水画、园林画、城市卷轴画中屋宇出现的环境场所，分析隐居图式和院落图式，以人本视角解读绘画表达出的栖居理想和空间意识。",24,4400,"2024-03-01 00:00:00","江苏凤凰文艺出版社","画中居·游：走进古代中国画的建筑场所",50449,{"aliasName":39,"author":149,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":150,"brand":74,"categories":151,"cbid":155,"centerADid":6,"centerAuthorId":156,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":157,"discount":6,"epubAllMaxFreeChapter":35,"finished":31,"form":32,"free":12,"hasEpub":31,"id":158,"intro":159,"isTxt":5,"lastChapter":160,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":161,"publishTime":162,"publisher":88,"rate":39,"sexAttr":40,"tags":9,"title":163,"totalChapters":160,"totalWords":164,"translator":9,"type":12},"陈波","2026-07-22 10:44:17",[152,153,154],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262502704573410,"4704806303905101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/679c94e083b92511bb6c20631537e50e.jpg",59843663,"本书分为五章：第一章“中国古典园林艺术”，简单介绍了中国古典园林的内涵与要素、审美体验、艺术境界和造园“意匠”等；第二章到第四章“园林动物景观营造”“园林诗画景观营造”“园林天象景观营造”，分别从动物景观、诗画景观、天象景观的角度入手，讲解了三类景观的营造对园林的作和以及营造技法，并提供了若干园林案例；第五章“园林雅俗活动开展”从园居生活与园林活动入手，解析古人在园林中开展的各项雅俗活动，点明了园林的营造是为了服务人的生活。本书在前作《图解中国园林》的基础上，以中国古典园林八大要素中的四项升华要素为对象进行阐述，介绍了丰富的园林知识，尽可能融知识性与趣味性于一体，做到轻松有趣、通俗易懂、图文并茂。希望本书能为读者了解中国古典园林的营造与园居生活的趣味提供参考，让读者体会中国园林的魅力。",58,3400,"2025-05-01 00:00:00","图解中国园林2",50612,{"aliasName":39,"author":166,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":167,"brand":9,"categories":168,"cbid":172,"centerADid":6,"centerAuthorId":173,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":174,"discount":6,"epubAllMaxFreeChapter":175,"finished":31,"form":32,"free":12,"hasEpub":31,"id rimg/2026-07-22/dd1407a2c79f4416051bfdd00072f3ce.jpg",59843557,"本书是夏昌世教授多年来艺海拾贝，累积成篇，作为岭南新建筑拓荒者的思想及创作的珍贵资料，亦是我国园林研究的重要成果。夏教授对中国古典园林的研究不只囿于怀古，而是吸收丰富素材，孕生现代建筑创作新风格。全书分为八篇，其中专设“南北造园风格及其特点”章节。早在20世纪30年代，作者就曾与梁思成、刘敦祯、卢奉璋先生一起，考察江南一带的私家园林，50—60年代又做了深入的调查研究。因此，此章论述具有相当的权威性和启发性，它传承、发扬和发展了以《园冶》和计成、李渔等为代表的中国古典园林学理论和实践的精华。夏昌世教授于1995年出版的《园林述要》一书，被业界堪称为《园冶》的“现代版续编”。本书在《园林述要》的基础上重新整理，传承、发扬和发展了以《园冶》和计成、李渔等为代表的中国古典园林学理论和实践的精华。",7900,"2025-06-01 00:00:00","古典园林述要",70936,[239,255,271,287,303,319],{"author":240,"authorId":6,"categories":241,"centerADid":6,"centerAuthorId":245,"chapterUpdatetime":9,"cover":246,"discount":6,"extra":247,"finished":31,"free":12,"hasEpub":5,"id":249,"intro":250,"isTxt":31,"lastChapter":213,"lastChapterName":251,"price":252,"score":6,"sexAttr":40,"title":253,"totalChapters":213,"totalWords":254,"type":12},"陈璞编著",[242,243,244],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"18642226901200601","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-06-08/517b1a43827dc2f84085795f7d9d6784.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":248},"38796",35038350,"中华文化曾是东方文化的摇篮，也是推动整个世界始终发展的动力。早在500年前，中华文化催生了欧洲文艺复兴运动和地理大发现。在200年前，中华文化推动了欧洲启蒙运动和现代思想。中国四大发明先后传到西方，对于促进西方工业社会发展和形成，曾起到了重要作用。中国文化最具博大性和包容性，所以世界各国都已经掀起中国文化热。中华文化的力量，已经深深熔铸到我们的生命力、创造力和凝聚力中，是我们民族的基因。中华民族的精神，也已深深植根于绵延数千年的优秀文化传统之中，是我们的精神家园。但是，当我们为中华文化而自豪时，也要正视其在近代衰微的历史。相对于五千年的灿烂文化来说，这仅仅是短暂的低潮，是喷薄前的力量积聚。","第9章 白带山麓的云居寺",699,"御赐的古寺",41112,{"author":256,"authorId":6,"categories":257,"centerADid":6,"centerAuthorId":261,"chapterUpdatetime":9,"cover":262,"discount":6,"extra":263,"finished":31,"free":12,"hasEpub":31,"id":265,"intro":266,"isTxt":5,"lastChapter":267,"lastChapterName":9,"price":268,"score":6,"sexAttr":40,"title":269,"totalChapters":267,"totalWords":270,"type":12},"于洋",[258,259,260],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"11194125900526901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-08-28/51ea658bc2f225e9c20dcf2feb919274.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":264},"29186",32913822,"本书一共介绍了20世纪以来的205个瑞士及周边建筑案例。每个案例都在给出基本信息的同时，附上了额外的介绍。这些额外的介绍有些是技术细节，有些是文化背景，有些是设计感悟，有些是国情对比，有些是背后故事。这使得本书不仅可以作为一本瑞士建筑旅行指南，更是一本瑞士当代建筑案例合集。作为旅行手册，读者可以根据目录之后的“主题线路推荐”制定特色线路。作为建筑介绍，读者可以根据“阅读话题推荐”更深入地了解各个案例的来龙去脉。作为作品合集，读者可以根据正文后的“建筑师索引”了解该建筑师的重要作品。作为史料汇编，读者可以根据正文后的“年代索引”了解特定时期的瑞士建筑全景。但无论如何，本书大目的是让读者获得一个切入瑞士建筑的角度，无论通过旅行还是阅读，终建立对瑞士建筑的个人化理解。",44,4990,"瑞士：多元文化建筑",147387,{"author":272,"authorId":6,"categories":273,"centerADid":6,"centerAuthorId":277,"chapterUpdatetime":9,"cover":278,"discount":6,"extra":279,"finished":31,"free":12,"hasEpub":31,"id":281,"intro":282,"isTxt":5,"lastChapter":283,"lastChapterName":9,"price":284,"score":6,"sexAttr":40,"title":285,"totalChapters":283,"totalWords":286,"type":12},"张复合 刘亦师主编",[274,275,276],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"19789658701116301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-04-02/d593b24f151a7effd7fd4a0d5c6cf0c5.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":280},"29760",27111124,"本书是中国建筑学会建筑史学分会近代建筑史学术委员会编纂的《中国近代建筑研究与保护》学术丛书的第十部——第15次中国近代建筑史学术年会会刊（2016）。全书共载论文63篇，内容涉及军事史视角下的近代建筑与城市研究，近代城市与建筑考察研究及保护，近代建筑技术考察与研究，近代建筑类型与特征，近代建筑史料考辨、建筑理论研究，建筑活动与近代建筑教育研究。书中论文反映了近两年的最新研究成果，具有学术代表性。本书对城市规划、建筑设计人员吸取近代建筑历史经验、从事现代城市规划和建筑设计有指导作用，对文物保护部门和开发单位保护与再利用近代建筑、开发历史地段具参考价值，可作为建筑历史研究资料、高等院校建筑学专业历史理论课程参考教材。",388,8960,"中国近代建筑研究与保护（十）",487346,{"author":288,"authorId":6,"categories":289,"centerADid":6,"centerAuthorId":293,"chapterUpdatetime":9,"cover":294,"discount":6,"extra":295,"finished":31,"free":12,"hasEpub":31,"id":297,"intro":298,"isTxt":5,"lastChapter":299,"lastChapterName":9,"price":300,"score":6,"sexAttr":40,"title":301,"totalChapters":299,"totalWords":302,"type":12},"浙江大学建筑工程学院院志编写委员会",[290,291,292],{"id":17,"name":18,"shortName":18},{"id":20,"name":21," b02fb9a16ef607aa7a6dadcd8f7.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":372},"53126",54477070,"《中国建筑史》一书是梁思成先生1944年完成的，当时对中国建筑的研究尚处于起步的阶段。对古建筑的实地调查也仅仅限于l932—1937年这短短的5年时间。在这样短的时间里，要弄清中国建筑两千年来发展的历史源流，梳理清楚其发展脉络，自然只能先从主流建筑人手，这就是为什么此书内容侧重于宫殿庙宇（即重点在大木作）。而对中国建筑中极富特色的园林，丰富多彩的民居基本没有论及。此书完成后，先生深感建筑史尚需深入的课题还很多。但当时正是抗战胜利，军兴以还，各地城市摧毁已甚，失地收复之后，立即有复兴焦土的艰巨工作随之而至，所需人才当以万计，当务之急是为国家造就建设人才，首先是建筑师。今后数十年，国家建设实有待于此辈人才之养成。因此他到清华大学创办了建筑系，建筑史的研究只得暂缓进行。",41,1360,"中国建筑史",133199,{"author":380,"authorId":6,"categories":381,"centerADid":6,"centerAuthorId":385,"chapterUpdatetime":9,"cover":386,"discount":6,"extra":387,"finished":31,"free":12,"hasEpub":31,"id":389,"intro":390,"isTxt":5,"lastChapter":299,"lastChapterName":9,"price":391,"score":6,"sexAttr":40,"title":392,"totalChapters":299,"totalWords":393,"type":12},"谢景",[382,383,384],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"26954893802865101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2023-07-17/8377869dc3b77d6176381b2cd7ae1757.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":388},"29798",47216119,"庭院、斗拱和藻井作为中国古建筑的三大重要元素，其源远流长。学术界对于它们的探讨一直以来没有停息过。建筑实践更是受到了这些中国元素的影响，特别是在重要公共文化建筑中，它们一直被创新性地诠释。但是，目前绝大多数的学术研究对于这些建筑元素都是围绕在其类型学和结构功能方面的，在人文上的研究甚少。或许正是因为缺少人文上的基础研究，导致了现代建筑实践中把庭院、斗拱和藻井仅仅作为一种空间、结构和视觉元素。本书追溯庭院、斗拱和藻井在早期中国的渊源，以及它们在汉代一系列与天国和升天主题相关的演绎。本研究的基础材料主要为考古发现的新石器时代遗址，商周青铜器和宫殿庙宇遗址，汉代石墓、画像石和铜镜等，以及古文字和文献资料。通过研究可以看到庭院、斗拱和藻井在早期有效地表达了中国古人的宇宙观、世界观和人生观。",4060,"中国建筑要素溯源：庭院、斗拱和藻井",68056,{"author":240,"authorId":6,"categories":395,"centerADid":6,"centerAuthorId":245,"chapterUpdatetime":9,"cover":246,"discount":6,"extra":399,"finished":31,"free":12,"hasEpub":5,"id":249,"intro":250,"isTxt":31,"lastChapter":213,"lastChapterName":251,"price":252,"score":6,"sexAttr":40,"title":253,"totalChapters":213,"totalWords":254,"type":12},[396,397,398],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},{"f
