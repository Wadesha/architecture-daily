-1252317822.file.myqcloud.com/bookcoverimg/2026-08-31/23df82980a0aca2b987c99175660faa5.jpg",7,60652480,"郊外别墅是文艺复兴时期的典型文化现象，从别墅的建筑外观到内部装饰都镌刻着深深的古典主义痕迹。本书选取了最具代表性的佛罗伦萨和罗马郊外别墅为描写对象，追溯了郊外别墅的古典起源，描写了文艺复兴时期著名壁画大师——卡斯塔尼奥、波拉尤奥罗、拉斐尔等艺术巨匠的经典作品，通过对别墅壁画情节的细腻解读，为读者展示了文艺复兴时期这一充满神奇魅力而又外观独特的艺术形象，为大家拉开了一幅优美、充满人文主义情怀的文艺复兴画卷。",14,5880,"2018-10-01 00:00:00","社会科学文献出版社","文艺复兴时期的古典传统和艺术",175200,"于小琴",{"aliasName":39,"author":92,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":93,"brand":94,"categories":95,"cbid":99,"centerADid":6,"centerAuthorId":100,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":101,"discount":6,"epubAllMaxFreeChapter":102,"finished":31,"form":32,"free":12,"hasEpub":31,"id":103,"intro":104,"isTxt":5,"lastChapter":105,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":106,"publishTime":107,"publisher":108,"rate":39,"sexAttr":40,"tags":9,"title":109,"totalChapters":105,"totalWords":110,"translator":9,"type":12},"张一梦","2026-07-22 11:23:28","凤凰空间",[96,97,98],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262277404432700,"32432358307208101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/b8c4705195c88aae1d1d06c8d1e24999.jpg",5,59843414,"郭熙提出中国画“可游”和“可居”画论，本书中对应地以“游”与“居”两大部分展开。每一部分又同时涉及山水画和城市画两种题材，对应建筑学视野中对建筑、景观和城市统一的思考。第’二、三章从宏观的视角审视中国画，主要通过分析长卷这种绘画媒材，探讨中国画“游”中的时间意识。第’二章“山水画卷：咫尺千里的自然远意”与第三章“城市全景：一图百态的市井意向”分别对应着山水与城市题材的画作。通过解读山水、城市题材的长卷画、地图画，分析三远法、以大观小法等时空建构图式，读者将在全景漫游中了解古代人居环境构建的时间意识、自然观以及城市规划意向。第四章“山水屋宇：栖居自然的文人理想”与第’五章“城市建筑：内外之间的空间中介”是对第’二、三章出现过的画作的进一步分析，将视角从宏观放大至微观，聚焦画中的人居场所，探讨中国画“居”的空间意识。这两章主要关注山水画、园林画、城市卷轴画中屋宇出现的环境场所，分析隐居图式和院落图式，以人本视角解读绘画表达出的栖居理想和空间意识。",24,4400,"2024-03-01 00:00:00","江苏凤凰文艺出版社","画中居·游：走进古代中国画的建筑场所",50449,{"aliasName":39,"author":112,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":113,"brand":94,"categories":114,"cbid":118,"centerADid":6,"centerAuthorId":119,"chapterUpdateti ,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36210294607896104,"9501032203455301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-06-26/836bc7e927099f61fe39046ac6f835b0.JPEG",59761780,"建筑不只是简单的人类寄居之所，它也记录了人类社会的发展变革。人们习惯于从文化和艺术角度来审视建筑，却很少追问“建筑为什么存在”。英国知名建筑评论家迪耶·萨迪奇通过讲述帝国总理府、总统图书馆、水晶大教堂、世贸双子塔等知名建筑背后的故事，揭示了建筑的隐形语言——人们对权力的长久崇拜以及权贵通过建筑表达的无尽欲望。萨迪奇援引历史、地理、哲学、心理学、社会学等证据，雄辩地证明了建筑首先是权力的象征，然后才是美的表达。","第14章 注释",4080,"2022-05-01 00:00:00","重庆出版社","权力与建筑",213816,"吴真贞",{"aliasName":39,"author":187,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":188,"brand":94,"categories":189,"cbid":193,"centerADid":6,"centerAuthorId":194,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":195,"discount":6,"epubAllMaxFreeChapter":196,"finished":31,"form":32,"free":12,"hasEpub":31,"id":197,"intro":198,"isTxt":5,"lastChapter":199,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":200,"publishTime":201,"publisher":202,"rate":39,"sexAttr":40,"tags":9,"title":203,"totalChapters":199,"totalWords":204,"translator":9,"type":12},"梁思成著 向艳丽编","2026-07-22 11:44:40",[190,191,192],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262527303486504,"36464396904591401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/b357349e76a7fc43ee8f7bd7b5bb31b5.jpg",6,59843669,"中国建筑是延续了两千余年的工程技术，是中国文化的具体表现，是中华民族艺术的大宗遗产。《梁思成讲古建精编插图版》以梁思成先生相关著作为底本，精心编撰，对古建做通识性介绍。本书分为三大章节。第一章为古建基础，介绍中国古建的基本常识。第二章为古建风姿，讲解不同种类的建筑艺术，如佛教建筑、宫殿建筑、石窟造像、民居、桥梁、陵墓建筑等。第三章为古建闲谈，精选可读性较强，能体现梁思成先生哲思的建筑小品文。书中插图多梁思成先生的手绘原稿，图文互现，读者既可领略古建之美，也能领会其高超的绘图技术和严谨的学风。本书既可以作为建筑研究者的学习参考书，亦可成为普通古建爱好者的入门读物。",26,3490,"2026-01-01 00:00:00","江苏凤凰科学技术出版社","梁思成讲古建（精编插图版）",73798,{"aliasName":39,"author":206,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":207,"brand":94,"categories":208,"cbid":212,"centerADid":6,"centerAuthorId":213,"chapterUpdatetime":9,"checklevel":28,"copyrig ，总计14篇。以1932年至1955年为时间轴，既详实记录了中国建筑的特征与发展历程，又充分展现了林徽因先生对中国建筑的观点与评价。在《平郊建筑杂录》中，流露出对动荡时代古建筑难以保存的惋惜之情；在《现代住宅设计的参考》里，表达了对现代住宅的殷切期待；于《中国建筑彩画图案》序文中，则呈现出对中国建筑彩画的深入考证与由衷赞叹。本书既有学术的严谨性，又有描写的生动性，诗意的语言使广大读者能够更加直观地感受中国建筑的独特魅力。此外，书中还配有30余幅重新绘制的手绘图。因原文图纸精度欠佳故进行重绘，涵盖屋顶、斗拱、平面布局等内容。图文结合的呈现方式，让读者能够更加简便、直观地理解中国建筑的特色。",18,3990,"2025-01-01 00:00:00","林徽因谈中国建筑",150598,[240,255,271,287,302,318],{"author":241,"authorId":6,"categories":242,"centerADid":6,"centerAuthorId":246,"chapterUpdatetime":9,"cover":247,"discount":6,"extra":248,"finished":31,"free":6,"hasEpub":31,"id":250,"intro":251,"isTxt":5,"lastChapter":47,"lastChapterName":9,"price":252,"score":6,"sexAttr":40,"title":253,"totalChapters":47,"totalWords":254,"type":40},"刘凤云",[243,244,245],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"14676499605806201","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2019-10-25/2fe4737441de6e7b69fb6420dee8d866.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":249},"37811",26244528,"本书以17—18世纪的北京与江户为基本线索，侧重研究了城市中的政治与商业。第一、二、三章从城市空间的视角出发，讨论了政治体制对城市特别是都城的重要影响，以及在政治体制影响下中日各自的城市特点，论证了城市空间状态中的人居与造物多是由政府通过行政规划来完成的；另外还论述了在商业空间的形成及移动过程中起作用的因素等。在第四、五章中，将问题转向城市空间中的人群，即商人与町人、官僚与武士，此外还有旗人，分别找寻他们在城市化过程中所遇到的问题，并予以论述，从社会史的角度对城市中最主要的两大居民群体进行了观察。",2988,"北京与江户：17—18世纪的城市空间（清史研究丛书）",261920,{"author":256,"authorId":6,"categories":257,"centerADid":6,"centerAuthorId":261,"chapterUpdatetime":9,"cover":262,"discount":6,"extra":263,"finished":31,"free":6,"hasEpub":31,"id":265,"intro":266,"isTxt":5,"lastChapter":267,"lastChapterName":9,"price":268,"score":6,"sexAttr":40,"title":269,"totalChapters":267,"totalWords":270,"type":40},"李乾朗 俞怡萍著 黄崑谋 李乾朗等绘",[258,259,260],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"31939060507168701","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2025-02-13/96d499ccff765580474a036cbdd004e4.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":264},"34898",53534993,"《古迹入门》是一本全部以图解形式呈现的台湾古建筑入门书。台湾地区对于古建筑有着独特的划分方式，大致分为古迹、历史建筑、聚落建筑、纪念建筑等，其中古迹超过1000处，历史建筑更有上千处，已然成为宝岛文化重要的组成部分。其面貌多彩多姿，有三百多年前荷兰人所建的城堡，也有明清时代的古宅、寺庙、城郭，当然也有近代的建筑。每一处古迹都是传奇故事的舞台，是历史最真实的见证，其建筑之美更是艺术的完美表现。为了尽善尽美地呈现这些古建筑，本书精选25处不可错过的古建筑，以剖面、透视、鸟瞰等手法表现出来，并分类归纳观察要诀，图解构造细节、装饰艺术、空间功能，延伸历史背景与文化内涵，更是配备800余张手绘图和照片。再加上图文并茂的古迹年表、简明扼要的基础知识，以及不可错过之古迹的专家评介，《古迹入门》可以成为大家亲近、观察与理解台湾古迹的实用指南。阅读此书，大家亦可以触类旁通，掌握观看古迹的通用门道。",77,7490,"古迹入门：图解台湾经典古建筑（增订版）",125661,{"author":272,"authorId":6,"categories":273,"centerADid":6,"centerAuthorId":277,"chapterUpdatetime":9,"cover":278,"discount":6,"extra":279,"finished":31,"free":12,"hasEpub":31,"id":281,"intro":282,"isTxt":5,"lastChapter":283,"lastChapterName":9,"price":284,"score":6,"sexAttr":40,"title":285,"totalChapters":283,"totalWords":286,"type":12},"(法)勒·柯布西耶",[274,275,276],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"15064844705299301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-09-01/0b83821683330e9ccc7f61ab81b15936.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":280},"34372",24906250,"“20世纪20年代初，石头缝里迸出了一个孙猴子，柯布西耶出版了《走向新建筑》，造了玉皇大帝的反。”《走向新建筑》被称为“一本奇书”、“一本极重要的书”、“一本永远不会磨灭的书”，“它把几千年来的建筑价值观颠倒过来了”。几千年的建筑史无非是帝王将相宫殿庙宇的历史……他关心为普通而平常的人使用的普通而平常的住宅，将其当作建筑学的基本层次，而任凭宫殿倒塌。他关心人的尺度，强调恢复人道的基础，需要的标准、功能的标准、情感的标准，认为这就是一切。他提出了建筑必须走平民化、工业化、功能化道路，反对搞虚假装饰的古典主义；提出“住宅是住人的机器”这句划时代的名言，并建立了现代建筑的美学观念“工程师美学”。他的彻底性和坚定性，他的石破天惊的理论和观念，对世界现代建筑的形成和发展产生了重大而深刻的影响。",55,2900,"走向新建筑",70791,{"author":288,"authorId":6,"categories":289,"centerADid":6,"centerAuthorId":293,"chapterUpdatetime":9,"cover":294,"discount":6,"extra":295,"finished":31,"free":12,"hasEpub":31,"id":297,"intro":298,"isTxt":5,"lastChapter":299,"lastChapterName":9,"price":235,"score":6,"sexAttr":40,"title":300,"totalChapters":299,"totalWords":301,"type":12},"密小斯",[290,291,292],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"178560857 id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"18323165908585901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2025-11-13/1546cff7b989fa37961693659d44889c.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":371},"32026",56981587,"木拱廊桥就是中国建筑的居家日常与极端考验。廊是山林乡村的“起居室”，是路的停顿、村的边界、神的居所、人的聚合、地的景观；编木成拱的神奇技艺，是民间匠师在匮乏的物质条件与惊险的自然环境中，跳出窠臼的“应急”之举。于是木拱廊桥便成为一条特别的红线，既可串联生活与建造两种底层逻辑，又可揭示中国与西方的空间差异，集中、迥异而又关联，成为一把特殊的钥匙，剑走偏锋却刺入要害，帮助我们突破厚重历史的重重迷雾，打开中国建筑的隐秘“心锁”。从北宋《清明上河图》中的惊鸿一瞥，到入选联合国教科文组织人类非物质文化遗产代表作名录，从中国闽浙的深山，到欧洲的城市与市场，作者游走于东西方文明，穿行于古老的文献与木匠的斧凿，深入地方宗族的恩怨与匠师头脑的思维，跨越形式的表象，讲述匠师的传奇，揭秘建造文明的绝技。",44,5460,"传奇与绝技：木拱桥里的中国营造智慧",53511,{"author":379,"authorId":6,"categories":380,"centerADid":6,"centerAuthorId":384,"chapterUpdatetime":9,"cover":385,"discount":6,"extra":386,"finished":31,"free":12,"hasEpub":31,"id":388,"intro":389,"isTxt":5,"lastChapter":390,"lastChapterName":9,"price":391,"score":6,"sexAttr":40,"title":392,"totalChapters":390,"totalWords":393,"type":12},"周丽霞 肖东发",[381,382,383],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"13412777503769601","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-01-03/1bfb1627eb64d9272de57e8ed7436ee9.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":387},"32044",25064438,"总之，中国文化博大精深，是中华各族人民五千年来创造、传承下来的物质文明和精神文明的总和，其内容包罗万象，浩若星汉，具有很强文化纵深，蕴 含丰富宝藏。我们要实现中华文化伟大复兴，首先要站在传统文化前沿，薪火相传，一脉相承，弘扬和发展五千年来很好的、光明的、最最的、科学的、 文明的和自豪的文化现象，融合古今中外一切文化精华，构建具有中国特色的现代民族文化，向世界和未来展示中华民族的文化力量、文化价值、文化形 态与文化风采。为此，在有关专家指导下，我们收集整理了大量古今资料和最新研究成果，特别编撰了本套大型书系。主要包括独具特色的语言文字、浩 如烟海的文化典籍、名扬世界的科技工艺、异彩纷呈的文学艺术、充满智慧的中国哲学、完备而深刻的伦理道德、古风古韵的建筑遗存、深具内涵的自然 名胜、悠久传承的历史文明，还有各具特色又相互交融的地域文化和民族文化等，充分显示了中华民族厚重文化底蕴和强大民族凝聚力，具有极强系统性 、广博性和规模性。本套书系的特点是全景展现，纵横捭阖，内容采取讲故事的方式进行叙述，语言通俗，明白晓畅，图文并茂，形象直观，古风古韵， 格调高雅，具有很强的可读性、欣赏性、知识性和延伸性，能够让广大读者全面触摸和感受中国文化的丰富内涵，增强中华儿女民族自尊心和文化自豪感 ，并能很好继承和弘扬中国文化，创造未来中国特色的最最民族文化。",29,999,"壮丽皇宫：三大故宫的建筑壮景",73891,{"author":39
