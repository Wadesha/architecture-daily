ame":21,"shortName":21},{"id":23,"name":24,"shortName":25},36210294607896104,"9501032203455301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-06-26/836bc7e927099f61fe39046ac6f835b0.JPEG",59761780,"建筑不只是简单的人类寄居之所，它也记录了人类社会的发展变革。人们习惯于从文化和艺术角度来审视建筑，却很少追问“建筑为什么存在”。英国知名建筑评论家迪耶·萨迪奇通过讲述帝国总理府、总统图书馆、水晶大教堂、世贸双子塔等知名建筑背后的故事，揭示了建筑的隐形语言——人们对权力的长久崇拜以及权贵通过建筑表达的无尽欲望。萨迪奇援引历史、地理、哲学、心理学、社会学等证据，雄辩地证明了建筑首先是权力的象征，然后才是美的表达。","第14章 注释",4080,"2022-05-01 00:00:00","重庆出版社","权力与建筑",213816,"吴真贞",[237,253,269,285,299,315],{"author":238,"authorId":6,"categories":239,"centerADid":6,"centerAuthorId":243,"chapterUpdatetime":9,"cover":244,"discount":6,"extra":245,"finished":31,"free":12,"hasEpub":31,"id":247,"intro":248,"isTxt":5,"lastChapter":249,"lastChapterName":9,"price":250,"score":6,"sexAttr":40,"title":251,"totalChapters":249,"totalWords":252,"type":12},"张驭寰",[240,241,242],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"16819687404920401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2022-04-19/88b0937c1fa1523839103eba68dacf82.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":246},"30424",43529592,"《中国城池史》是古建筑专家张驭寰先生的城建智慧。我国城池开始甚早，经过五千多年筑城的发展，历代建设的城池，从都城到一般城池，近于千座，再加上明清以来各县镇建城至少有三千多座，总计四千至五千座城池。这是浩大壮伟的工程，显示出中国先民的气魄。这些城池不仅仅数量多，而且其中有许多城池规划设计手法与今天做城市规划有直接应用的意义。",113,2490,"中国城池史",156534,{"author":254,"authorId":6,"categories":255,"centerADid":6,"centerAuthorId":259,"chapterUpdatetime":9,"cover":260,"discount":6,"extra":261,"finished":31,"free":12,"hasEpub":31,"id":263,"intro":264,"isTxt":5,"lastChapter":265,"lastChapterName":9,"price":266,"score":6,"sexAttr":40,"title":267,"totalChapters":265,"totalWords":268,"type":12},"肖鹏",[256,257,258],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"22029611509637101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2022-07-14/eb334d1df14e09b9725c06061d9b14bd.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":262},"32989",44476199,"本书以时间为轴，以地标性建筑为线索，介绍了自先秦时期到现代的中国建筑，将中国的建筑发展史及各个时期的建筑风格娓娓道来,并辅以丰富多彩的插图，将中国建筑的形象清晰地展现在读者面前。本书共分为十一章,重点介绍了先秦时期的木构建筑、秦朝时期的经典建筑、两汉时期的宫殿建筑、魏晋南北朝时期的佛教建筑、隋唐时期的宏大建筑、五代辽宋金时期的多元建筑、元明时期的建筑群、清代的皇家建筑、中国近代的中西融合建筑以及中国现代的城市建筑。本书内容丰富、史料翔实，文字简洁明雅，是一部富有实用价值的中国建筑知识普及读本。",111,2499,"一本书读懂中国建筑",151911,{"author":270,"authorId":6,"categories":271,"centerADid":6,"centerAuthorId":275,"chapterUpdatetime":9,"cover":276,"discount":6,"extra":277,"finished":31,"free":12,"hasEpub":31,"id":279,"intro":280,"isTxt":5,"lastChapter":281,"lastChapterName":9,"price":282,"score":6,"sexAttr":40,"title":283,"totalChapters":281,"totalWords":284,"type":12},"杨钺（青木Axe）编著",[272,273,274],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"28241020502366901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2023-12-13/9f8bc0dcf50fc81e6bae9de989616c13.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":278},"38302",47549185,"本书囊括了作者八年以来在中式古典建筑设计和施工一线的实践经验和资料整理的成果。和学术专著不同，这本书并没有明确的时代界限，因为在古典建筑营造技术的发展历史中，实际的做法、风格和术语早已互相融合，模糊了时代和地域的边界。本书采用图解形式，将三百余张精美的手绘插图与通俗易懂的文字解析相结合，向读者系统地讲解了每一个古典建筑构件的加工和安装过程，剖析了一些常见的民间中式古典建筑营造工艺和结构。其中还加入了大量附着于古典建筑上的雕刻、纹样，以及有趣的典故和民间传说。本书适合传统文化爱好者、艺术从业者、历史文化研究者、建筑设计师和相关专业的学生阅读使用。",147,13080,"中国古建筑结构图鉴（精装版）",24474,{"author":183,"authorId":6,"categories":286,"centerADid":6,"centerAuthorId":190,"chapterUpdatetime":9,"cover":290,"discount":6,"extra":291,"finished":31,"free":12,"hasEpub":31,"id":293,"intro":294,"isTxt":5,"lastChapter":295,"lastChapterName":9,"price":296,"score":6,"sexAttr":40,"title":297,"totalChapters":295,"totalWords":298,"type":12},[287,288,289],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-08-24/bffea6faebd4ad303d23e75d7916beed.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":292},"29545",40107975,"本书基于作者收集的大量有关长城的第一手资料，通过轻松易读的语言和图文并茂的形式，以对长城的了解和讲述为主线，配合所绘制的手绘作品与图示，复原和剖析曾经的及现存的长城的知识及构造，并展示及解读大量碑刻类文物实例。本书包括长城的定义、长城的履历、巨龙的身躯、个性的敌楼、迅捷的警报、强大的武备、不凡的关隘、失去的记忆、毁灭与伤痛九章内容，以常人不熟悉和不了解的角度，解读一个与众不同的长城。本书适合爱好历史文化与建筑的广大读者阅读。",60,4990,"不一样的长城",159176,{"author":300,"authorId":6,"categories":301,"centerADid":6,"centerAuthorId":305,"chapterUpdatetime":9,"cover":306,"discount":6,"extra":307,"finished":31,"free":12,"hasEpub":31,"id":309,"intro":310,"isTxt":5,"lastChapter":311,"lastChapterName":9,"price":312,"score":6,"sexAttr":40,"title":313,"totalChapters":311,"totalWords":314,"type":12},"周丽霞 肖东发",[302,303,304],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"13412777503769601","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-01-03/1bfb1627eb64d9272de57e8ed7436ee9.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":308},"32044",25064438,"总之，中国文化博大精深，是中华各族人民五千年来创造、传承下来的物质文明和精神文明的总和，其内容包罗万象，浩若星汉，具有很强文化纵深，蕴 含丰富宝藏。我们要实现中华文化伟大复兴，首先要站在传统文化前沿，薪火相传，一脉相承，弘扬和发展五千年来很好的、光明的、最最的、科学的、 文明的和自豪的文化现象，融合古今中外一切文化精华，构建具有中国特色的现代民族文化，向世界和未来展示中华民族的文化力量、文化价值、文化形 态与文化风采。为此，在有关专家指导下，我们收集整理了大量古今资料和最新研究成果，特别编撰了本套大型书系。主要包括独具特色的语言文字、浩 如烟海的文化典籍、名扬世界的科技工艺、异彩纷呈的文学艺术、充满智慧的中国哲学、完备而深刻的伦理道德、古风古韵的建筑遗存、深具内涵的自然 名胜、悠久传承的历史文明，还有各具特色又相互交融的地域文化和民族文化等，充分显示了中华民族厚重文化底蕴和强大民族凝聚力，具有极强系统性 、广博性和规模性。本套书系的特点是全景展现，纵横捭阖，内容采取讲故事的方式进行叙述，语言通俗，明白晓畅，图文并茂，形象直观，古风古韵， 格调高雅，具有很强的可读性、欣赏性、知识性和延伸性，能够让广大读者全面触摸和感受中国文化的丰富内涵，增强中华儿女民族自尊心和文化自豪感，并能很好继承和弘扬中国文化，创造未来中国特色的最最民族文化。",29,999,"壮丽皇宫：三大故宫的建筑壮景",73891,{"author":316,"authorId":6,"categories":317,"centerADid":6,"centerAuthorId":321,"chapterUpdatetime":9,"cover":322,"discount":6,"extra":323,"finished":31,"free":12,"hasEpub":31,"id":325,"intro":326,"isTxt":5,"lastChapter":327,"lastChapterName":9,"price":328,"score":6,"sexAttr":40,"title":329,"totalChapters":327,"totalWords":330,"type":12},"王国彬",[318,319,320],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"3061773600757220 over":367,"discount":6,"extra":368,"finished":31,"free":12,"hasEpub":5,"id":370,"intro":371,"isTxt":31,"lastChapter":47,"lastChapterName":372,"price":373,"score":6,"sexAttr":40,"title":374,"totalChapters":47,"totalWords":375,"type":12},"知夏",[363,364,365],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"9501000203789401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2025-08-28/d50ad7f430bc84e7416a65be78556d30.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":369},"57498",56120361,"一砖一瓦，镌刻历史兴衰；一榫一卯，暗藏天地乾坤。从宫殿庙宇到亭台楼阁，揭开每一处飞檐斗拱背后的传奇。从辽东到甘南，从蒙北到西川……二十年间，作者曾跋山涉水，走过许多地方，寻访古建筑，投身于当地历史乃至风士人情当中。有些古建筑闻名遐迩，但更多的是人迹罕至、鲜为人知。有时在僻远村隅，人烟稀少，能攀谈的也只有全国重点文物保护单位的守门人……除了将古建知识和背后故事娓娓道来、用相机记录下古建的旧貌新颜外，作者还写了一些读诗读书经历。许多诗中之意、书中之理本不理解，在一次次远行中，偶有感悟乍现，便更不虚此行。","第46章 后记",2990,"穿越千年看古建",165790,{"author":377,"authorId":6,"categories":378,"centerADid":6,"centerAuthorId":382,"chapterUpdatetime":9,"cover":383,"discount":6,"extra":384,"finished":31,"free":12,"hasEpub":31,"id":386,"intro":387,"isTxt":5,"lastChapter":388,"lastChapterName":9,"price":389,"score":6,"sexAttr":40,"title":390,"totalChapters":388,"totalWords":391,"type":12},"孙大章",[379,380,381],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"19547481008984101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-03-12/8adf2119a4b3699a2dae39e0d3194e10.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":385},"30426",27110186,"中国古代建筑在世界建筑文化宝库中独树一帜。但在中国的现代化进程中，建筑及建筑研究受到其他因素的影响较大，导致中国现当代——尤其是20世纪末期到21世纪——建筑的发展呈现出较为混乱的局面。针对这种情况，对于中国古代建筑的普及和宣传就显得尤为迫切。本书以“史话”体裁，概括而形象地为广大读者介绍了我国古代建筑的发展流程、独特的艺术风格和精湛的技术，为进一步了解和发扬我国古代建筑的优秀传统奠定了基础，并在继承传统与探索革新的过程中，起到不可多得的引导作用。",88,2730,"中国古代建筑小史",78797,{"author":393,"authorId":6,"categories":394,"centerADid":6,"centerAuthorId":398,"chapterUpdatetime":9,"cover":399,"discount":6,"extra":400,"finished":31,"free":12,"hasEpub":5,"id":402,"intro":403,"isTxt":31,"
