-01 00:00:00","社会科学文献出版社","文艺复兴时期的古典传统和艺术",175200,"于小琴",{"aliasName":39,"author":148,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":149,"brand":150,"categories":151,"cbid":155,"centerADid":6,"centerAuthorId":156,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":157,"discount":6,"epubAllMaxFreeChapter":6,"finished":31,"form":32,"free":12,"hasEpub":5,"id":158,"intro":159,"isTxt":31,"lastChapter":140,"lastChapterName":160,"maxfreechapter":12,"oversea":6,"price":161,"publishTime":162,"publisher":163,"rate":39,"sexAttr":40,"tags":9,"title":164,"totalChapters":140,"totalWords":165,"translator":166,"type":12},"(英)迪耶·萨迪奇","2026-06-29 11:30:22","华章同人",[152,153,154],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36210294607896104,"9501032203455301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-06-26/836bc7e927099f61fe39046ac6f835b0.JPEG",59761780,"建筑不只是简单的人类寄居之所，它也记录了人类社会的发展变革。人们习惯于从文化和艺术角度来审视建筑，却很少追问“建筑为什么存在”。英国知名建筑评论家迪耶·萨迪奇通过讲述帝国总理府、总统图书馆、水晶大教堂、世贸双子塔等知名建筑背后的故事，揭示了建筑的隐形语言——人们对权力的长久崇拜以及权贵通过建筑表达的无尽欲望。萨迪奇援引历史、地理、哲学、心理学、社会学等证据，雄辩地证明了建筑首先是权力的象征，然后才是美的表达。","第14章 注释",4080,"2022-05-01 00:00:00","重庆出版社","权力与建筑",213816,"吴真贞",{"aliasName":39,"author":168,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":169,"brand":93,"categories":170,"cbid":174,"centerADid":6,"centerAuthorId":175,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":176,"discount":6,"epubAllMaxFreeChapter":137,"finished":31,"form":32,"free":12,"hasEpub":31,"id":177,"intro":178,"isTxt":5,"lastChapter":179,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":180,"publishTime":181,"publisher":182,"rate":39,"sexAttr":40,"tags":9,"title":183,"totalChapters":179,"totalWords":184,"translator":9,"type":12},"刘敦桢著 凤凰空间编","2026-07-22 11:34:16",[171,172,173],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"sho 中国建筑彩画的深入考证与由衷赞叹。本书既有学术的严谨性，又有描写的生动性，诗意的语言使广大读者能够更加直观地感受中国建筑的独特魅力。此外，书中还配有30余幅重新绘制的手绘图。因原文图纸精度欠佳故进行重绘，涵盖屋顶、斗拱、平面布局等内容。图文结合的呈现方式，让读者能够更加简便、直观地理解中国建筑的特色。",18,3990,"2025-01-01 00:00:00","林徽因谈中国建筑",150598,[240,256,272,288,304,320],{"author":241,"authorId":6,"categories":242,"centerADid":6,"centerAuthorId":246,"chapterUpdatetime":9,"cover":247,"discount":6,"extra":248,"finished":31,"free":12,"hasEpub":31,"id":250,"intro":251,"isTxt":5,"lastChapter":252,"lastChapterName":9,"price":253,"score":6,"sexAttr":40,"title":254,"totalChapters":252,"totalWords":255,"type":12},"梁思成",[243,244,245],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"14270007004176101","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2023-03-07/52a61070276e85ba8eacb3e8244dae03.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":249},"41366",46536243,"中国建筑是延续了两千余年的工程技术，本身已成一个系统，许多建筑物便是中国文化的具体表现，是中华民族艺术的大宗遗产。《中国建筑史》是由SHOU位用现代科学方法研究中国古代建筑的学者梁思成先生编写，同时也是SHOU部由中国人自己编写的公正权威的中国建筑史。其按照中国历史发展顺序：上古、两汉、魏晋南北朝、隋唐、五代宋辽金、元明清、清末及民国以后，涉及了中国历史上几乎所有的建筑类型，小到阶基、勾栏、柱础、斗栱、雕饰、门窗，大到陵墓、石窟、寺观、宫殿、住宅、都市。在丰富的历史文献基础上，列举实物、分析特征，清晰地展现了各种建筑形制及其发展变化。我们今天读中国建筑史，是为了防止犯之前削足适履、张冠李戴式的错误，是为了在未来选择、创造自己的理想生活方式。",41,3900,"中国建筑史",142054,{"author":257,"authorId":6,"categories":258,"centerADid":6,"centerAuthorId":262,"chapterUpdatetime":9,"cover":263,"discount":6,"extra":264,"finished":31,"free":12,"hasEpub":5,"id":266,"intro":267,"isTxt":31,"lastChapter":35,"lastChapterName":268,"price":269,"score":6,"sexAttr":40,"title":270,"totalChapters":35,"totalWords":271,"type":12},"陈文斌主编",[259,260,261],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"22719774409954301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2022-03-10/46dcd1f0c40219c4ad4a30ae3de9a900.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":265},"39786",41978261,"本书从上古时期开篇，一一再现了人类建筑的非凡智慧。金字塔五千年永屹的奥秘是什么？古罗马角斗场是古代建筑的巅峰吗？科隆大教堂是歌 },{"id":23,"name":24,"shortName":25},"15064844705299301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-09-01/0b83821683330e9ccc7f61ab81b15936.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":378},"34372",24906250,"“20世纪20年代初，石头缝里迸出了一个孙猴子，柯布西耶出版了《走向新建筑》，造了玉皇大帝的反。”《走向新建筑》被称为“一本奇书”、“一本极重要的书”、“一本永远不会磨灭的书”，“它把几千年来的建筑价值观颠倒过来了”。几千年的建筑史无非是帝王将相宫殿庙宇的历史……他关心为普通而平常的人使用的普通而平常的住宅，将其当作建筑学的基本层次，而任凭宫殿倒塌。他关心人的尺度，强调恢复人道的基础，需要的标准、功能的标准、情感的标准，认为这就是一切。他提出了建筑必须走平民化、工业化、功能化道路，反对搞虚假装饰的古典主义；提出“住宅是住人的机器”这句划时代的名言，并建立了现代建筑的美学观念“工程师美学”。他的彻底性和坚定性，他的石破天惊的理论和观念，对世界现代建筑的形成和发展产生了重大而深刻的影响。",55,2900,"走向新建筑",70791,{"author":273,"authorId":6,"categories":386,"centerADid":6,"centerAuthorId":278,"chapterUpdatetime":9,"cover":390,"discount":6,"extra":391,"finished":31,"free":12,"hasEpub":31,"id":393,"intro":394,"isTxt":5,"lastChapter":234,"lastChapterName":9,"price":285,"score":6,"sexAttr":40,"title":395,"totalChapters":234,"totalWords":396,"type":12},[387,388,389],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-02-14/41e06cea83a9752fb8e97d637e495c39.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":392},"29255",27775361,"中华文化就是居住在中国地域内的中华民族及其祖先所创造的、为中华民族世世代代所继承发展的、具有鲜明民族特色而内涵博大精深的传统优良文化，历史十分悠久，流传非常广泛，在世界上拥有巨大的影响，是世界上唯一绵延不绝而从没中断的古老文化，并始终充满了生机与活力。浩浩历史长河，熊熊文明薪火，中华文化源远流长，滚滚黄河、滔滔长江是最直接的源头，这两大文化浪涛经过千百年冲刷洗礼和不断交流、融合以及沉淀，最终形成了求同存异、兼收并蓄的辉煌灿烂的中华文明。","壮丽的城楼",37085,{"author":398,"authorId":6,"categories":399,"centerADid":6,"centerAuthorId":403,"chapterUpdatetime":9,"cover":404,"discount":6,"extra":405,"finished":31,"free":12,"hasEpub":31,"id":407,"intro":408,"isTxt":5,"lastChapter":409,"lastChapterName":9,"price":410,"score":6,"sexAttr":40,"title":411,"totalChapters":409,"totalWords":412,"type":12},"于洋",[400,401,402],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"11194125900526901","http:
