/ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-14/676f41c36e40e0718579bfbb25e4f2df.jpg",5,59843348,"本书精心收录了林徽因先生近乎所有独立创作的建筑文稿，总计14篇。以1932年至1955年为时间轴，既详实记录了中国建筑的特征与发展历程，又充分展现了林徽因先生对中国建筑的观点与评价。在《平郊建筑杂录》中，流露出对动荡时代古建筑难以保存的惋惜之情；在《现代住宅设计的参考》里，表达了对现代住宅的殷切期待；于《中国建筑彩画图案》序文中，则呈现出对中国建筑彩画的深入考证与由衷赞叹。本书既有学术的严谨性，又有描写的生动性，诗意的语言使广大读者能够更加直观地感受中国建筑的独特魅力。此外，书中还配有30余幅重新绘制的手绘图。因原文图纸精度欠佳故进行重绘，涵盖屋顶、斗拱、平面布局等内容。图文结合的呈现方式，让读者能够更加简便、直观地理解中国建筑的特色。",18,3990,"2025-01-01 00:00:00","江苏凤凰科学技术出版社","林徽因谈中国建筑",150598,{"aliasName":39,"author":92,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":93,"brand":74,"categories":94,"cbid":98,"centerADid":6,"centerAuthorId":99,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":100,"discount":6,"epubAllMaxFreeChapter":101,"finished":31,"form":32,"free":12,"hasEpub":31,"id":102,"intro":103,"isTxt":5,"lastChapter":104,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":105,"publishTime":106,"publisher":107,"rate":39,"sexAttr":40,"tags":9,"title":108,"totalChapters":104,"totalWords":109,"translator":9,"type":12},"刘敦桢著 凤凰空间编","2026-07-22 11:34:16",[95,96,97],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262481604568810,"36464386904588901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/a23de8236c38395e068ab27b616c83a4.jpg",7,59843628,"中国古典园林是具有高度艺术成就和独特风格的园林艺术体系，而苏州古典园林式中国古典园林的集大成者。本书是刘敦桢院士深入苏州园林考察与测量，历经多年整理出版的古典园林研究的著作，是研究苏州园林的经典作品，也是中国建筑史上的重要著作。书内分总论和实例两个章节，其中总论包括绪论、布局、理水、叠山、建筑、花木六部分；实例则详细介绍了15个典型的苏州园林，并通过实地测量，精心绘制了300余张墨线图。其中部分园林现已损毁，因此，本书所记载的照片和测绘图成为研究此部分园林的珍贵作品。",28,7900,"2025-06-01 00:00:00","江苏凤凰文艺出版社","苏州古典园林",66390,{"aliasName":39,"author":111,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":112,"brand":74,"categories":113,"cbid":117,"centerADid":6,"centerAuthorId":118,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":119,"discount":6,"epubAllMaxFreeChapter 生现代建筑创作新风格。全书分为八篇，其中专设“南北造园风格及其特点”章节。早在20世纪30年代，作者就曾与梁思成、刘敦祯、卢奉璋先生一起，考察江南一带的私家园林，50—60年代又做了深入的调查研究。因此，此章论述具有相当的权威性和启发性，它传承、发扬和发展了以《园冶》和计成、李渔等为代表的中国古典园林学理论和实践的精华。夏昌世教授于1995年出版的《园林述要》一书，被业界堪称为《园冶》的“现代版续编”。本书在《园林述要》的基础上重新整理，传承、发扬和发展了以《园冶》和计成、李渔等为代表的中国古典园林学理论和实践的精华。",14,"古典园林述要",70936,{"aliasName":39,"author":143,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":144,"brand":74,"categories":145,"cbid":149,"centerADid":6,"centerAuthorId":150,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":151,"discount":6,"epubAllMaxFreeChapter":152,"finished":31,"form":32,"free":12,"hasEpub":31,"id":153,"intro":154,"isTxt":5,"lastChapter":155,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":156,"publishTime":157,"publisher":88,"rate":39,"sexAttr":40,"tags":9,"title":158,"totalChapters":155,"totalWords":159,"translator":9,"type":12},"梁思成著 向艳丽编","2026-07-22 11:44:40",[146,147,148],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262527303486504,"36464396904591401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/b357349e76a7fc43ee8f7bd7b5bb31b5.jpg",6,59843669,"中国建筑是延续了两千余年的工程技术，是中国文化的具体表现，是中华民族艺术的大宗遗产。《梁思成讲古建精编插图版》以梁思成先生相关著作为底本，精心编撰，对古建做通识性介绍。本书分为三大章节。第一章为古建基础，介绍中国古建的基本常识。第二章为古建风姿，讲解不同种类的建筑艺术，如佛教建筑、宫殿建筑、石窟造像、民居、桥梁、陵墓建筑等。第三章为古建闲谈，精选可读性较强，能体现梁思成先生哲思的建筑小品文。书中插图多梁思成先生的手绘原稿，图文互现，读者既可领略古建之美，也能领会其高超的绘图技术和严谨的学风。本书既可以作为建筑研究者的学习参考书，亦可成为普通古建爱好者的入门读物。",26,3490,"2026-01-01 00:00:00","梁思成讲古建（精编插图版）",73798,{"aliasName":39,"author":161,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":162,"brand":9,"categories":163,"cbid":167,"centerADid":6,"centerAuthorId":168,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":169,"discount":6,"epubAllMaxFreeChapter":170,"finished":31,"form":32,"free":12,"hasEpub":31,"id":171,"intro":172,"isTxt":5,"lastChapter":173,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":174,"pub ertime":39,"staticscore":260},"34898",53534993,"《古迹入门》是一本全部以图解形式呈现的台湾古建筑入门书。台湾地区对于古建筑有着独特的划分方式，大致分为古迹、历史建筑、聚落建筑、纪念建筑等，其中古迹超过1000处，历史建筑更有上千处，已然成为宝岛文化重要的组成部分。其面貌多彩多姿，有三百多年前荷兰人所建的城堡，也有明清时代的古宅、寺庙、城郭，当然也有近代的建筑。每一处古迹都是传奇故事的舞台，是历史最真实的见证，其建筑之美更是艺术的完美表现。为了尽善尽美地呈现这些古建筑，本书精选25处不可错过的古建筑，以剖面、透视、鸟瞰等手法表现出来，并分类归纳观察要诀，图解构造细节、装饰艺术、空间功能，延伸历史背景与文化内涵，更是配备800余张手绘图和照片。再加上图文并茂的古迹年表、简明扼要的基础知识，以及不可错过之古迹的专家评介，《古迹入门》可以成为大家亲近、观察与理解台湾古迹的实用指南。阅读此书，大家亦可以触类旁通，掌握观看古迹的通用门道。",77,7490,"古迹入门：图解台湾经典古建筑（增订版）",125661,{"author":268,"authorId":6,"categories":269,"centerADid":6,"centerAuthorId":273,"chapterUpdatetime":9,"cover":274,"discount":6,"extra":275,"finished":31,"free":12,"hasEpub":31,"id":277,"intro":278,"isTxt":5,"lastChapter":279,"lastChapterName":9,"price":280,"score":6,"sexAttr":40,"title":281,"totalChapters":279,"totalWords":282,"type":12},"方拥",[270,271,272],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"13173358905524401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2019-12-20/2b82d05768942e0d8377aca7d2d57de0.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":276},"32615",24274619,"《中国传统建筑十五讲》依据作者在北大开授中国传统建筑通选课的讲义而成，该课程在北大很受欢迎，是历年来最为学生喜爱的课程之一。《中国传统建筑十五讲》与通常讲述中国传统建筑的著作相比，突出了中国传统建筑的人文特质，尤其注重思考在当下西方建筑观念和建筑设计占据强势的情况下，如何挖掘和发展中国传统建筑中的精华。与此同时，作者也全面地介绍了中国传统建筑的各种类型，宫殿、园林、佛塔、桥梁等，并配有大量插图，与精湛的文字相得益彰。",97,1681,"中国传统建筑十五讲",192781,{"author":284,"authorId":6,"categories":285,"centerADid":6,"centerAuthorId":289,"chapterUpdatetime":9,"cover":290,"discount":6,"extra":291,"finished":31,"free":12,"hasEpub":31,"id":293,"intro":294,"isTxt":5,"lastChapter":295,"lastChapterName":9,"price":296,"score":6,"sexAttr":40,"title":297,"totalChapters":295,"totalWords":298,"type":12},"韩玉林 朱旭东 赵九洲",[286,287,288],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"12524514003471801","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2019-03-12/1b3ee05f42b28f91b7e2fd0dd52e99b1.jpg",
