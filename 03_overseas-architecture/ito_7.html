,{"aliasName":39,"author":10,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":52,"brand":53,"categories":54,"cbid":58,"centerADid":6,"centerAuthorId":27,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":59,"discount":6,"epubAllMaxFreeChapter":60,"finished":31,"form":32,"free":12,"hasEpub":31,"id":61,"intro":62,"isTxt":5,"lastChapter":63,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":64,"publishTime":65,"publisher":66,"rate":39,"sexAttr":40,"tags":9,"title":67,"totalChapters":63,"totalWords":68,"translator":69,"type":12},"2020-11-28 22:34:10","清华大学",[55,56,57],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},15367252005339306,"http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-11-28/582daa590f59d48bef71ea1e40255fcc.jpg",16,26943902,"这是作者于1944年出版的、旨在让日本国民了解本国建筑，进而产生民族自豪感的小书《日本建筑的真相》（日本建築の実相）。该书深入浅出，从日本建筑特色的产生原因入手，简明扼要地讲述了日本古建筑史，阐明了日本传统建筑的特性，日本建筑在世界建筑史的地位分析，以及日本建筑应何去何从。为便于读者理解，编辑和译者在书中插入了作者另一本专著《日本建筑研究》（日本建築の研究）的部分文字和图片，取名为《日本建筑小史》。时隔七十多年，其中的很多观点对现在的我们仍有借鉴和启发。",56,3430,"2017-03-01 00:00:00","清华大学出版社","日本建筑小史",80730,"杨田",[71,91,109,127,144,160,179,199,216],{"aliasName":39,"author":72,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":73,"brand":74,"categories":75,"cbid":79,"centerADid":6,"centerAuthorId":80,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":81,"discount":6,"epubAllMaxFreeChapter":82,"finished":31,"form":32,"free":12,"hasEpub":31,"id":83,"intro":84,"isTxt":5,"lastChapter":85,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":86,"publishTime":87,"publisher":88,"rate":39,"sexAttr":40,"tags":9,"title":89,"totalChapters":85,"totalWords":90,"translator":9,"type":12},"林徽因著 高钰琛 郑文霞编","2026-07-14 15:32:21","凤凰空间",[76,77,78],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262487507296010,"36397050804780901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-14/676f41c36e40e0718579bfbb25e4f2df.jpg",5,59843348,"本书精心收录了林徽因先生近乎所有独立创作的建筑文稿，总计14篇。以1932年至1955年为时间轴，既详实记录了中国建筑的特征与发展历程，又充分展现了林徽因先生对中国建筑的观点与评价。在《平郊建筑杂录》中，流露出对动荡时代古建筑难以保存的惋惜之情；在《现代住宅设计的参考》里，表达了对现代住宅的殷切期待；于《中国建筑彩画图案》序文中，则呈现出对中国建筑彩画的深入考证与由衷赞叹。本书既有学术的严谨性，又有描写的生动性，诗意的语言使广大读者能够更加直观地感受中国建筑的独特魅力。此外，书中还配有30余幅重新绘制的手绘图。因原文图纸精度欠佳故进行重绘，涵盖屋顶、斗拱、平面布局等内容。图文结合的呈现方式，让读者能够更加简便、直观地理解中国建筑的特色。",18,3990,"2025-01-01 00:00:00","江苏凤凰科学技术出版社","林徽因谈中国建筑",150598,{"aliasName":39,"author":92,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":93,"brand":74,"categories":94,"cbid":98,"centerADid":6,"centerAuthorId":99,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":100,"discount":6,"epubAllMaxFreeChapter":101,"finished":31,"form":32,"free":12,"hasEpub":31,"id":102,"intro":103,"isTxt":5,"lastChapter":104,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":105,"publishTime":106,"publisher":88,"rate":39,"sexAttr":40,"tags":9,"title":107,"totalChapters":104,"totalWords":108,"translator":9,"type":12},"梁思成著 向艳丽编","2026-07-22 11:44:40",[95,96,97],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262527303486504,"36464396904591401","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/b357349e76a7fc43ee8f7bd7b5bb31b5.jpg",6,59843669,"中国建筑是延续了两千余年的工程技术，是中国文化的具体表现，是中华民族艺术的大宗遗产。《梁思成讲古建精编插图版》以梁思成先生相关著作为底本，精心编撰，对古建做通识性介绍。本书分为三大章节。第一章为古建基础，介绍中国古建的基本常识。第二章为古建风姿，讲解不同种类的建筑艺术，如佛教建筑、宫殿建筑、石窟造像、民居、桥梁、陵墓建筑等。第三章为古建闲谈，精选可读性较强，能体现梁思成先生哲思的建筑小品文。书中插图多梁思成先生的手绘原稿，图文互现，读者既可领略古建之美，也能领会其高超的绘图技术和严谨的学风。本书既可以作为建筑研究者的学习参考书，亦可成为普通古建爱好者的入门读物。",26,3490,"2026-01-01 00:00:00","梁思成讲古建（精编插图版）",73798,{"aliasName":39,"author":110,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":111,"brand":74,"categories":112,"cbid":116,"centerADid":6,"centerAuthorId":117,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":118 、审美体验、艺术境界和造园“意匠”等；第二章到第四章“园林动物景观营造”“园林诗画景观营造”“园林天象景观营造”，分别从动物景观、诗画景观、天象景观的角度入手，讲解了三类景观的营造对园林的作和以及营造技法，并提供了若干园林案例；第五章“园林雅俗活动开展”从园居生活与园林活动入手，解析古人在园林中开展的各项雅俗活动，点明了园林的营造是为了服务人的生活。本书在前作《图解中国园林》的基础上，以中国古典园林八大要素中的四项升华要素为对象进行阐述，介绍了丰富的园林知识，尽可能融知识性与趣味性于一体，做到轻松有趣、通俗易懂、图文并茂。希望本书能为读者了解中国古典园林的营造与园居生活的趣味提供参考，让读者体会中国园林的魅力。",58,3400,"2025-05-01 00:00:00","图解中国园林2",50612,{"aliasName":39,"author":145,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":146,"brand":74,"categories":147,"cbid":151,"centerADid":6,"centerAuthorId":152,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":153,"discount":6,"epubAllMaxFreeChapter":154,"finished":31,"form":32,"free":12,"hasEpub":31,"id":155,"intro":156,"isTxt":5,"lastChapter":157,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":122,"publishTime":123,"publisher":124,"rate":39,"sexAttr":40,"tags":9,"title":158,"totalChapters":157,"totalWords":159,"translator":9,"type":12},"刘敦桢著 凤凰空间编","2026-07-22 11:34:16",[148,149,150],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36262481604568810,"36464386904588901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-07-22/a23de8236c38395e068ab27b616c83a4.jpg",7,59843628,"中国古典园林是具有高度艺术成就和独特风格的园林艺术体系，而苏州古典园林式中国古典园林的集大成者。本书是刘敦桢院士深入苏州园林考察与测量，历经多年整理出版的古典园林研究的著作，是研究苏州园林的经典作品，也是中国建筑史上的重要著作。书内分总论和实例两个章节，其中总论包括绪论、布局、理水、叠山、建筑、花木六部分；实例则详细介绍了15个典型的苏州园林，并通过实地测量，精心绘制了300余张墨线图。其中部分园林现已损毁，因此，本书所记载的照片和测绘图成为研究此部分园林的珍贵作品。",28,"苏州古典园林",66390,{"aliasName":39,"author":161,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":162,"brand":9,"categories":163,"cbid":167,"centerADid":6,"centerAuthorId":168,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":169,"discount":6,"epubAllMaxFreeChapter":170,"finished":31,"form":32,"free":12,"hasEpub":31,"id":171,"intro":172,"isTxt":5,"lastChapter":173,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":174,"publishT re":259},"29798",47216119,"庭院、斗拱和藻井作为中国古建筑的三大重要元素，其源远流长。学术界对于它们的探讨一直以来没有停息过。建筑实践更是受到了这些中国元素的影响，特别是在重要公共文化建筑中，它们一直被创新性地诠释。但是，目前绝大多数的学术研究对于这些建筑元素都是围绕在其类型学和结构功能方面的，在人文上的研究甚少。或许正是因为缺少人文上的基础研究，导致了现代建筑实践中把庭院、斗拱和藻井仅仅作为一种空间、结构和视觉元素。本书追溯庭院、斗拱和藻井在早期中国的渊源，以及它们在汉代一系列与天国和升天主题相关的演绎。本研究的基础材料主要为考古发现的新石器时代遗址，商周青铜器和宫殿庙宇遗址，汉代石墓、画像石和铜镜等，以及古文字和文献资料。通过研究可以看到庭院、斗拱和藻井在早期有效地表达了中国古人的宇宙观、世界观和人生观。",45,4060,"中国建筑要素溯源：庭院、斗拱和藻井",68056,{"author":267,"authorId":6,"categories":268,"centerADid":6,"centerAuthorId":272,"chapterUpdatetime":9,"cover":273,"discount":6,"extra":274,"finished":31,"free":12,"hasEpub":5,"id":276,"intro":277,"isTxt":31,"lastChapter":226,"lastChapterName":278,"price":279,"score":6,"sexAttr":40,"title":280,"totalChapters":226,"totalWords":281,"type":12},"陈璞编著",[269,270,271],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"18642226901200601","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-06-08/517b1a43827dc2f84085795f7d9d6784.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":275},"38796",35038350,"中华文化曾是东方文化的摇篮，也是推动整个世界始终发展的动力。早在500年前，中华文化催生了欧洲文艺复兴运动和地理大发现。在200年前，中华文化推动了欧洲启蒙运动和现代思想。中国四大发明先后传到西方，对于促进西方工业社会发展和形成，曾起到了重要作用。中国文化最具博大性和包容性，所以世界各国都已经掀起中国文化热。中华文化的力量，已经深深熔铸到我们的生命力、创造力和凝聚力中，是我们民族的基因。中华民族的精神，也已深深植根于绵延数千年的优秀文化传统之中，是我们的精神家园。但是，当我们为中华文化而自豪时，也要正视其在近代衰微的历史。相对于五千年的灿烂文化来说，这仅仅是短暂的低潮，是喷薄前的力量积聚。","第9章 白带山麓的云居寺",699,"御赐的古寺",41112,{"author":283,"authorId":6,"categories":284,"centerADid":6,"centerAuthorId":288,"chapterUpdatetime":9,"cover":289,"discount":6,"extra":290,"finished":31,"free":12,"hasEpub":31,"id":292,"intro":293,"isTxt":5,"lastChapter":262,"lastChapterName":9,"price":294,"score":6,"sexAttr":40,"title":295,"totalChapters":262,"totalWords":296,"type":12},"万幼楠",[285,286,287],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"13354339405574701","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2019-09-06/ca9018a81bf5f86dc574cc2fe0212ace.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":291},"30608",25016579,"在建筑美学视野中，客家有千姿百态的建筑造型。本书对赣南客家的建筑进行了全面深入探讨。作者从赣南的古村落、民民、祠堂、墓塔、庙宇、桥梁、山寨、古隘道等建筑群进行了考察。除了文字的论述，还收入大量的图片资料。",3999,"赣南客家建筑研究",173437,{"author":298,"authorId":6,"categories":299,"centerADid":6,"centerAuthorId":303,"chapterUpdatetime":9,"cover":304,"discount":6,"extra":305,"finished":31,"free":12,"hasEpub":5,"id":307,"intro":308,"isTxt":31,"lastChapter":35,"lastChapterName":309,"price":310,"score":6,"sexAttr":40,"title":311,"totalChapters":35,"totalWords":312,"type":12},"金东瑞",[300,301,302],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"4697373403299901","https://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/images/cover/2017-01-17/b1eaea2c08e5ad00e214a0521c3d0663.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":306},"45161",605927,"中国古塔是中国五千年文明史的载体之一，被佛教界人士尊为佛塔。在当代中国辽阔美丽的大地上，随处都可以看到古塔的踪影。这些千姿百态的古塔，其造型之华美，结构之精巧，雕刻、装饰之华丽，都堪称古代建筑中的精品。我国的古塔虽然种类繁多，建筑材料和构成方法不尽相同，但是，这些古塔的基本结构是大体一样的。古塔由四部分组成：地宫、塔基、塔身、塔刹。塔这种古老的建筑，不仅被佛教界人士广为尊重，也为各地山林园林增添了绚丽的色彩。金东瑞编著的《中国古塔》介绍了我国的古塔文化，内容包括：中国古塔的起源、历史沿革、塔的结构、塔的材质、塔的造型、中国古塔文化等。","第10章 中国古塔文化",99,"中国古塔",29704,{"author":314,"authorId":6,"categories":315,"centerADid":6,"centerAuthorId":319,"chapterUpdatetime":9,"cover":320,"discount":6,"extra":321,"finished":31,"free":12,"hasEpub":5,"id":323,"intro":324,"isTxt":31,"lastChapter":325,"lastChapterName":326,"price":327,"score":6,"sexAttr":40,"title":328,"totalChapters":325,"totalWords":329,"type":12},"王金锋 林风编著",[316,317,318],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"11194129100302701","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-05-18/b743a6b9db5c55c60967428f98d573fb.JPEG",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":322},"41385",38131866,"本书内容包括了有千古名楼——岳阳楼、鲁肃为操练水军修建阅军楼、神仙协助木匠修建岳阳楼、唐朝文人雅士齐赞岳阳楼、北宋腾子京募捐重建楼阁、历代官员对楼阁的维修、重修以后的岳阳楼全貌、楼阁 m/bookcoverimg/2025-11-25/3f21ed3a15f4b03fe86667a0e5cbea10.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":366},"37069",57092852,"直观解构。全书配手绘古建筑剖析图，精准拆解建筑部位与构件，结合各朝代幸存建筑代表作，直观呈现古建结构之美与演变脉络。系统全面。从古建筑的屋顶式样、建筑类型、组成部分，到传统寺庙类别、各朝代典型建筑，全覆盖式内容，帮读者搭建扎实的中国古建筑知识体系。简单易懂。直白文字搭配多图引线标注，清晰标注古建内部解构，读者如同置身古建筑现场，轻松理解专业内容。实战应用。不仅深入讲解古建筑专业知识，更助读者实地参观时，看懂建筑细节、理解其历史内涵，从“看热闹”转变成“看门道”。",73,8280,"看懂古建筑",119657,{"author":374,"authorId":6,"categories":375,"centerADid":6,"centerAuthorId":379,"chapterUpdatetime":9,"cover":380,"discount":6,"extra":381,"finished":31,"free":12,"hasEpub":31,"id":383,"intro":384,"isTxt":5,"lastChapter":385,"lastChapterName":9,"price":386,"score":6,"sexAttr":40,"title":387,"totalChapters":385,"totalWords":388,"type":12},"杨钺（青木Axe）编著",[376,377,378],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"28241020502366901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2023-12-13/9f8bc0dcf50fc81e6bae9de989616c13.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":382},"38302",47549185,"本书囊括了作者八年以来在中式古典建筑设计和施工一线的实践经验和资料整理的成果。和学术专著不同，这本书并没有明确的时代界限，因为在古典建筑营造技术的发展历史中，实际的做法、风格和术语早已互相融合，模糊了时代和地域的边界。本书采用图解形式，将三百余张精美的手绘插图与通俗易懂的文字解析相结合，向读者系统地讲解了每一个古典建筑构件的加工和安装过程，剖析了一些常见的民间中式古典建筑营造工艺和结构。其中还加入了大量附着于古典建筑上的雕刻、纹样，以及有趣的典故和民间传说。本书适合传统文化爱好者、艺术从业者、历史文化研究者、建筑设计师和相关专业的学生阅读使用。",147,13080,"中国古建筑结构图鉴（精装版）",24474,{"author":390,"authorId":6,"categories":391,"centerADid":6,"centerAuthorId":395,"chapterUpdatetime":9,"cover":396,"discount":6,"extra":397,"finished":31,"free":12,"hasEpub":31,"id":399,"intro":400,"isTxt":5,"lastChapter":401,"lastChapterName":9,"price":402,"score":6,"sexAttr":40,"title":403,"totalChapters":401,"totalWords":404,"type":12},"(法)勒·柯布西耶",[392,393,394],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"15064844705299301","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2021-04-20/149b113eb0e458bb768250cb782792d7.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":398},"32592",37475308,"柯布西耶代表作，首度收录17张柯布西耶《世界遗产名录》建筑作品彩插，法语直译！这是一本揭示建筑设计方法、颠覆建筑价值观的书，向世界宣告一个全新的建筑时代的来临。本书是柯布西耶在其主编的《新精神》杂志上发表的文章结集，书中阐述了何为机械美学，以及有关工业、经济、形式与功能的关系。作者提倡建筑走平民化、工业化、功能化的道路，以及相应的建筑美学革新，其石破天惊的理念对现代建筑的形成和发展产生了重大而深刻的影响。柯布西耶指出现代建筑应当结合时代的需求、抛却虚华的空洞、批量建造住宅，提出“住宅是居住的机器”这句划时代的名言，并确立了现代建筑的美学观念“工程师美学”。",22,4999,"走向新建筑",61752,{"author":217,"authorId":6,"categories":406,"centerADid":6,"centerAuthorId":224,"chapterUpdatetime":9,"cover":410,"discount":6,"extra":411,"finished":31,"free":12,"hasEpub":31,"id":413,"intro":414,"isTxt":5,"lastChapter":415,"lastChapterName":9,"price":416,"score":6,"sexAttr":40,"title":417,"totalChapters":415,"totalWords":418,"type":12},[407,408,409],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-07-03/7331614be91bba50fad08fd241ab93db.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":412},"38454",31904253,"山西省现在保存着全国约70%的明以前大木构建筑，各类形式的古建筑保有量更是高居全国之冠，唐、五代、宋、金、元等早期古建筑不胜枚举，明清时期的古建筑群更是数量极为庞大，被誉为“古建筑爱好者的天堂”。本书按地域划分，以绘画和游记的形式将晋中、晋北的中国传统建筑之美展现给读者，同时也记录了众多古民居的现状，希望唤起更多读者对中国传统建筑和文化的关注、热爱和保护。",210,6930,"寻访山西古庙：晋中、晋北篇",241955,{"author":420,"authorId":6,"categories":421,"centerADid":6,"centerAuthorId":425,"chapterUpdatetime":9,"cover":426,"discount":6,"extra":427,"finished":31,"free":12,"hasEpub":31,"id":429,"intro":430,"isTxt":5,"lastChapter":431,"lastChapterName":9,"price":432,"score":6,"sexAttr":40,"title":433,"totalChapters":431,"totalWords":434,"type":12},"许超",[422,423,424],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},"18280117508807901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2020-09-25/81ad7e9b667c7719a10ae13652a3e122.jpg",{"favcount":39,"allwords":39,"newchaptertime":39,"staticscore":428},"29486",33783213,"精选全国最具价值、最具特色的古镇、古村、古民居，古代建筑群，以当地的建筑元素为主体，进行功能性、历史性、溯源性的解读，深入
