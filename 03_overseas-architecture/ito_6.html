7822.file.myqcloud.com/bookcoverimg/2026-07-22/b8c4705195c88aae1d1d06c8d1e24999.jpg",5,59843414,"郭熙提出中国画“可游”和“可居”画论，本书中对应地以“游”与“居”两大部分展开。每一部分又同时涉及山水画和城市画两种题材，对应建筑学视野中对建筑、景观和城市统一的思考。第’二、三章从宏观的视角审视中国画，主要通过分析长卷这种绘画媒材，探讨中国画“游”中的时间意识。第’二章“山水画卷：咫尺千里的自然远意”与第三章“城市全景：一图百态的市井意向”分别对应着山水与城市题材的画作。通过解读山水、城市题材的长卷画、地图画，分析三远法、以大观小法等时空建构图式，读者将在全景漫游中了解古代人居环境构建的时间意识、自然观以及城市规划意向。第四章“山水屋宇：栖居自然的文人理想”与第’五章“城市建筑：内外之间的空间中介”是对第’二、三章出现过的画作的进一步分析，将视角从宏观放大至微观，聚焦画中的人居场所，探讨中国画“居”的空间意识。这两章主要关注山水画、园林画、城市卷轴画中屋宇出现的环境场所，分析隐居图式和院落图式，以人本视角解读绘画表达出的栖居理想和空间意识。",24,4400,"2024-03-01 00:00:00","江苏凤凰文艺出版社","画中居·游：走进古代中国画的建筑场所",50449,{"aliasName":39,"author":92,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":93,"brand":9,"categories":94,"cbid":98,"centerADid":6,"centerAuthorId":99,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":100,"discount":6,"epubAllMaxFreeChapter":101,"finished":31,"form":32,"free":12,"hasEpub":31,"id":102,"intro":103,"isTxt":5,"lastChapter":104,"lastChapterName":9,"maxfreechapter":6,"oversea":6,"price":105,"publishTime":106,"publisher":107,"rate":39,"sexAttr":40,"tags":9,"title":108,"totalChapters":104,"totalWords":109,"translator":9,"type":12},"连达","2026-08-31 11:36:13",[95,96,97],{"id":17,"name":18,"shortName":18},{"id":20,"name":21,"shortName":21},{"id":23,"name":24,"shortName":25},36747114904193500,"10080942104693901","http://ccstatic-1252317822.file.myqcloud.com/bookcoverimg/2026-08-31/415b7694f3ecef01dc39042a8741de4f.jpg",9,60622401,"本书为《看懂古建筑》精华版，从古建筑的分类和各部位、构件要素的演变进行梳理和讲述，并以各地的现存古建筑实例来说明古建筑在历史上的发展演变。全书完整保留原作知识体系与核心精华内容，优化篇幅与开本设计，将古建筑解构进行解剖，为读者构建起一系列在中国建筑史上具有重要地位的古建筑框架。",52,3540,"2026-07-01 00:00:00","电子工业出版社","看懂古建筑（精华版）",81703,{"aliasName":39,"author":111,"authorAvatar":39,"authorBelongsite":6,"authorId":6,"bookFromType":12,"bookUpdatetime":112,"brand":9,"categories":113,"cbid":117,"centerADid":6,"centerAuthorId":118,"chapterUpdatetime":9,"checklevel":28,"copyrightInfo":9,"cover":119,"discount":6,"epubAllMaxFreeChapter":120,"fi
